  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .eyebrow{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }

  /* ---------- chrome ---------- */
  /* Masthead: navy warms toward the moss of the brand mark, so the two
     brand colours read as one family rather than two unrelated blocks. */
  header.top{
    background:
      radial-gradient(120% 180% at 88% 0%, rgba(47,107,79,.30) 0%, rgba(47,107,79,0) 62%),
      linear-gradient(103deg, #0C1E2E 0%, #10283A 46%, #123128 100%);
    color:#fff;position:sticky;top:0;z-index:20;
    padding:max(14px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 6px 18px -12px rgba(8,20,14,.7);
  }
  header.top::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,#2F6B4F 0%,#7FC3A0 22%,rgba(127,195,160,.16) 60%,transparent 100%);
  }
  .masthead{
    max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .mark{display:flex;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
  .wordmark{display:flex;align-items:center;gap:10px;margin:0;font-weight:400}
  .wm-name{
    font-family:var(--serif);font-size:25px;line-height:1.1;letter-spacing:-.005em;color:#F2F6F3;
  }
  /* Second word set lighter so the lockup has an internal rhythm rather than one flat block */
  .wm-thin{color:#93B7A4;font-style:italic;margin-left:.3em}
  /* The year is data, so it takes the mono face used for every other figure */
  .demoflag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#E3D3A0;border:1px solid rgba(227,211,160,.45);border-radius:3px;padding:3px 7px;margin-left:8px}
  .wm-year{
    font-size:12px;letter-spacing:.06em;color:#9FD3B7;
    border:1px solid rgba(127,195,160,.42);border-radius:3px;
    padding:3px 8px;background:rgba(127,195,160,.10);
  }
  .stamp{
    font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8FA6B8;
    padding-left:14px;border-left:1px solid rgba(255,255,255,.14);
  }
  .syncbadge{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;
    border-radius:20px;border:1px solid rgba(255,255,255,.2);color:#8FA6B8;white-space:nowrap;
  }
  .syncbadge.saved{color:#9FD3B7;border-color:rgba(127,195,160,.45);background:rgba(127,195,160,.12)}
  .syncbadge.saving{color:#E3D3A0;border-color:rgba(227,211,160,.4)}
  .syncbadge.error{color:#E8A79A;border-color:rgba(232,167,154,.45);background:rgba(232,167,154,.1)}
  .syncbadge.signedout{color:#8FA6B8}
  /* `hidden` must win over the display:flex below, or the overlay never goes away */
  .authgate[hidden]{display:none !important}
  .authgate{
    position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 140% at 70% 0%, rgba(47,107,79,.28) 0%, rgba(47,107,79,0) 60%),
               linear-gradient(103deg,#0C1E2E 0%,#10283A 46%,#123128 100%);
    padding:24px;
  }
  .authbox{
    background:var(--card);border-radius:6px;padding:32px 30px 28px;max-width:400px;width:100%;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55);text-align:center;
  }
  .authbox h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:14px 0 6px;color:var(--ink)}
  .authbox p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5}
  .authbox input{
    width:100%;font:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--rule-2);
    border-radius:3px;margin-bottom:10px;background:#FBFCFA;
  }
  .authbox input:focus{outline:2px solid var(--moss-2);outline-offset:-1px;background:#fff}
  .authbtn{
    width:100%;font:inherit;font-size:14px;font-weight:600;padding:11px;cursor:pointer;
    background:var(--moss);color:#fff;border:0;border-radius:3px;transition:background .15s;
  }
  .authbtn:hover{background:var(--moss-2)}
  .authmsg{font-size:12.5px;color:var(--moss);margin-top:14px;min-height:18px;line-height:1.45}
  .authmsg.bad{color:var(--red)}
  .offlinebtn{
    display:block;width:100%;margin-top:12px;font:inherit;font-size:12.5px;cursor:pointer;
    background:transparent;border:1px solid var(--rule-2);border-radius:3px;padding:9px;color:var(--muted);
  }
  .offlinebtn:hover{border-color:var(--moss-2);color:var(--moss)}
  .offlinebtn[hidden]{display:none}
  .authalt{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
  .authalt > span{font-size:11.5px;color:var(--muted);display:block;margin-bottom:9px}
  .authcode{display:flex;gap:8px}
  .authcode input{margin:0;flex:1;font-family:var(--mono);letter-spacing:.24em;text-align:center}
  .authbtn.small{width:auto;padding:11px 18px;font-size:13px}
  .toolbar{margin-left:auto;display:flex;gap:7px}
  .btn{
    font:inherit;font-size:12px;font-weight:500;color:#D6E4DC;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);border-radius:3px;
    padding:6px 13px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
  }
  .btn:hover{background:rgba(127,195,160,.20);border-color:rgba(127,195,160,.55);color:#fff}
  .btn.ghost{background:transparent;color:#8FA6B8}
  .btn.ghost:hover{background:rgba(255,255,255,.08);color:#D6E4DC;border-color:rgba(255,255,255,.3)}
  .btn:focus-visible{outline:2px solid #8FD0AE;outline-offset:2px}

  .headfoot{
    max-width:1180px;margin:11px auto 0;display:flex;align-items:flex-end;gap:16px;
  }
  nav.tabs{display:flex;gap:2px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.015em;white-space:nowrap;
    background:transparent;border:0;border-bottom:3px solid transparent;
    color:#8FA6B8;padding:9px 15px 10px;cursor:pointer;border-radius:3px 3px 0 0;
    transition:color .15s,background .15s;
  }
  nav.tabs button:hover{color:#E4EFE8;background:rgba(255,255,255,.05)}
  nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#7FC3A0;background:rgba(127,195,160,.10)}
  nav.tabs button:focus-visible{outline:2px solid #8FD0AE;outline-offset:-2px}

  /* Live net worth readout — the masthead ornament is the data itself */
  .ticker{
    display:flex;align-items:center;gap:9px;padding-bottom:7px;flex:0 0 auto;
  }
  .ticker .tk-lab{
    font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#7A93A6;
  }
  .ticker .tk-val{font-family:var(--mono);font-size:14px;color:#EAF3ED;letter-spacing:-.01em}
  .ticker .tk-chg{font-family:var(--mono);font-size:11.5px}
  .ticker .tk-chg.up{color:#7FC3A0}
  .ticker .tk-chg.down{color:#E39B8F}
  .ticker svg{display:block;opacity:.9}

  main{max-width:1180px;margin:0 auto;padding:26px max(24px, env(safe-area-inset-right)) max(80px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left))}
  .view[hidden]{display:none}

  h2.section{
    font-family:var(--serif);font-size:19px;font-weight:600;
    margin:0 0 2px;letter-spacing:.01em;
  }
  .section-note{color:var(--muted);font-size:12.5px;margin:0 0 16px;max-width:62ch}

  .card{
    background:var(--card);border:1px solid var(--rule);border-radius:3px;
    padding:16px 18px;
  }
  .card h3{
    font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 12px;
    display:flex;align-items:baseline;gap:8px;
  }
  .card h3 .tag{margin-left:auto}

  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpis.five{grid-template-columns:repeat(5,1fr)}
  .kpis.six{grid-template-columns:repeat(6,1fr)}
  @media (max-width:1150px){ .kpis.six{grid-template-columns:repeat(3,1fr)} }
  /* Keeps the summary visible while inputs below are being edited */
  .kpis.sticky{
    position:sticky;top:104px;z-index:10;
    background:var(--paper);padding:10px 0;margin-top:-10px;
    box-shadow:0 10px 12px -10px rgba(16,34,51,.16);
  }
  .kpi{
    background:var(--card);border:1px solid var(--rule);border-radius:3px;
    padding:13px 15px 14px;
  }
  .kpi .v{font-family:var(--mono);font-size:25px;letter-spacing:-.02em;margin-top:5px;color:var(--ink)}
  .kpis.six .kpi .v{font-size:21px}
  .kpis.six .kpi .sub{font-size:11px;line-height:1.4}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.accent{background:var(--moss);border-color:var(--moss)}
  .kpi.accent .eyebrow{color:#9DC7B0}
  .kpi.accent .v{color:#fff}
  .kpi.accent .sub{color:#B7D3C3}

  /* signature: allocation ribbon */
  .ribbon-wrap{position:relative;margin:22px 0 0}
  .ribbon{display:flex;height:52px;border-radius:2px;overflow:hidden;border:1px solid var(--rule-2)}
  .seg{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;transition:flex-basis .5s cubic-bezier(.2,.7,.3,1)}
  .seg .pct{font-family:var(--mono);font-size:13px;color:#fff;opacity:.95}
  .seg-fixed{background:var(--ink-2)}
  .seg-invest{background:var(--moss-2)}
  .seg-save{background:#7A9C86}
  .seg-free{background:#C6D2C9}
  .seg-free .pct{color:var(--ink)}
  .cap{position:absolute;top:-8px;bottom:-8px;width:1px;background:var(--red);z-index:3}
  .cap::after{
    content:attr(data-label);position:absolute;top:-15px;left:4px;white-space:nowrap;
    font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:600;
  }
  .legend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .legend div{border-top:2px solid var(--rule);padding-top:7px}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:baseline}
  .legend .amt{font-family:var(--mono);font-size:15px;margin-top:2px;display:block}
  .legend .lab{font-size:11.5px;color:var(--muted)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .grid3{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:12px;margin-top:14px}

  /* 401k gauges */
  .gauge{margin-bottom:14px}
  .gauge:last-child{margin-bottom:0}
  .gauge .row{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
  .gauge .who{font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:11px}
  .gauge .amt{margin-left:auto;font-family:var(--mono)}
  .track{height:9px;background:#EDF0EC;border-radius:1px;margin:6px 0 4px;position:relative;overflow:hidden}
  .fill{height:100%;background:var(--moss-2);transition:width .5s ease}
  .fill.over{background:var(--red)}
  .gauge .hint{font-size:11.5px;color:var(--muted)}

  .tag{
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:2px;white-space:nowrap;
  }
  .tag.ok{background:var(--green-bg);color:var(--green)}
  .tag.warn{background:var(--amber-bg);color:var(--amber)}
  .tag.bad{background:var(--red-bg);color:var(--red)}

  ul.alerts{list-style:none;margin:0;padding:0}
  ul.alerts li{
    display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:12.5px;
  }
  ul.alerts li:last-child{border-bottom:0}
  ul.alerts .dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  ul.alerts .dot.bad{background:var(--red)}
  ul.alerts .dot.warn{background:var(--amber)}
  ul.alerts .dot.ok{background:var(--green)}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse}
  th,td{padding:5px 8px;text-align:right;font-size:13px}
  th:first-child,td:first-child{text-align:left}
  thead th{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    font-weight:700;border-bottom:1px solid var(--rule-2);padding-bottom:7px;
  }
  tbody tr:hover{background:#FAFBF9}
  td.lab{color:var(--text)}
  td.calc{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
  tr.total td{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);font-weight:700;background:#FBFCFA}
  tr.sub td{border-top:1px solid var(--rule);font-weight:600;color:var(--moss)}
  tr.group td{
    padding-top:16px;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);
  }
  td .note{font-size:11px;color:var(--muted);display:block}
  .rowdel{
    border:0;background:transparent;color:#C4CAC3;cursor:pointer;font-size:14px;
    padding:0 2px;line-height:1;visibility:hidden;
  }
  tr:hover .rowdel{visibility:visible}
  .rowdel:hover{color:var(--red)}

  /* inputs: blue = editable, mirroring the workbook's convention */
  input.cell{
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
    color:var(--blue);background:#F3F7FD;border:1px solid #D3E0F2;border-radius:2px;
    padding:3px 7px;width:104px;text-align:right;
  }
  input.cell.wide{width:100%;text-align:left;font-family:var(--sans)}
  input.cell.pct{width:74px;border-right:0;border-radius:2px 0 0 2px}
  .pctwrap{display:inline-flex;align-items:stretch;white-space:nowrap}
  .pctwrap .suffix{
    display:flex;align-items:center;padding:0 6px;font-family:var(--mono);font-size:12px;
    color:var(--blue);background:#E7EFFA;border:1px solid #D3E0F2;border-left:0;border-radius:0 2px 2px 0;
  }
  input.cell.note-in{
    color:var(--muted);background:transparent;border:1px solid transparent;font-size:11.5px;
  }
  input.cell.note-in:hover{border-color:var(--rule);background:#FBFCFA}
  input.cell.note-in:focus{color:var(--blue);background:#F3F7FD;border-color:#D3E0F2}
  .caprule{font-size:11.5px;color:var(--muted);font-weight:400;font-family:var(--sans)}
  .plainline{
    font-size:14px;line-height:1.55;color:#33413A;background:#F2F6F3;
    border-left:3px solid var(--moss-2);padding:11px 15px;border-radius:0 2px 2px 0;
    margin:0 0 16px;max-width:none;
  }
  .plainline strong{color:var(--moss);font-family:var(--mono);font-size:13.5px}

  /* Tax inputs: independent field groups rather than three tables in a
     grid. Tables stretched to the tallest sibling, which opened ragged
     gaps on wide screens and misaligned every row. */
  .inputwrap{
    display:grid;gap:14px 30px;align-items:start;
    grid-template-columns:minmax(340px,1.45fr) minmax(210px,1fr) minmax(210px,1fr);
  }
  .ig{min-width:0}
  .ig-head, .ig-row{
    display:grid;grid-template-columns:1fr 92px 92px;gap:9px;align-items:center;
  }
  .ig.one .ig-head, .ig.one .ig-row{grid-template-columns:1fr 108px}
  .ig-head{
    padding-bottom:7px;margin-bottom:2px;border-bottom:1px solid var(--rule-2);
  }
  .ig-head .eyebrow:not(:first-child){text-align:right}
  .ig-row{padding:6px 0;border-bottom:1px solid var(--rule)}
  .ig-row:last-child{border-bottom:0}
  .ig-lab{font-size:13px;line-height:1.35;color:var(--text)}
  .ig-lab em{
    display:block;font-style:normal;font-size:11px;color:var(--muted);
    margin-top:1px;line-height:1.35;
  }
  .ig-row input.cell{width:100%}
  .ig-row .val{
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;
  }
  .ig-row .val.span2{grid-column:2 / span 2}
  /* every editable cell in the income inputs table gets the same footprint */
  .inputs-tbl{table-layout:fixed}
  .inputs-tbl input.cell{width:100%}
  .inputs-tbl .pctwrap{display:flex;width:100%}
  .inputs-tbl .pctwrap input.cell{flex:1;width:auto;min-width:0}
  .inputs-tbl td{vertical-align:middle}
  .ig-row.sub{border-top:1px solid var(--rule-2);font-weight:600}
  .ig-row.sub .ig-lab{color:var(--moss);font-weight:600}
  .ig-row.grand{
    border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);
    background:#FBFCFA;font-weight:700;margin-top:2px;
  }
  @media (max-width:980px){
    .inputwrap{grid-template-columns:1fr}
    .ig{padding-bottom:6px}
  }

  /* Tax calculation: the running total reads as a flow, the rate detail
     as a table. Separating them stops long notes from stretching rows. */
  .calcflow{margin:2px 0 4px}
  .calcflow.bottom{margin-top:12px}
  .cf-line{
    display:flex;align-items:baseline;gap:14px;padding:7px 0;
    border-bottom:1px solid var(--rule);font-size:13.5px;
  }
  .cf-line span{flex:1}
  .cf-line em{
    display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px;
  }
  .cf-line b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .cf-line.muted b{white-space:normal;text-align:right}
  .cf-line.muted{align-items:flex-start}
  .cf-line.result{border-top:1px solid var(--rule-2);border-bottom:0;color:var(--moss)}
  .cf-line.result b{color:var(--moss)}
  .cf-line.grand{
    border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);
    background:#FBFCFA;font-weight:700;padding:9px 8px;font-size:14px;
  }
  .cf-line.muted{border-bottom:0;color:var(--muted);font-size:12px}
  .cf-line.muted b{font-weight:400;color:var(--muted);font-size:12px}
  .calcband{
    font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);
    background:#F1F4F1;border-left:3px solid var(--moss-2);
    padding:6px 11px;margin:16px 0 2px;border-radius:0 2px 2px 0;
  }
  .card.guide{background:#FBFCFA}
  .card.guide p{font-size:13.5px;line-height:1.6;color:#33413A;margin:0 0 12px}
  .guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;margin-top:4px}
  .guide-grid p{margin:0 0 16px}
  @media (max-width:820px){ .guide-grid{grid-template-columns:1fr} }
  .card.guide p strong{color:var(--ink)}
  .card.guide .guide-note{
    font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:11px;
  }
  .card.guide .guide-note strong{color:var(--moss)}
  .yearly{
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--amber);background:var(--amber-bg);border-radius:2px;padding:2px 5px;
    margin-left:6px;vertical-align:1px;font-family:var(--sans);
  }
  .calcband.tight{margin:0 0 6px;font-size:13px;padding:5px 10px}
  .calctbl{table-layout:fixed}
  .calctbl td.rate b{font-family:var(--mono);font-size:13px}
  .calctbl td.rate em{
    display:block;font-style:normal;font-size:10.5px;color:var(--muted);
    font-family:var(--sans);margin-top:1px;
  }
  .calctbl th{vertical-align:bottom}

  /* ---------- card benefits ---------- */
  .subsection{
    font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);
    margin:26px 0 10px;
  }
  .cardgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;align-items:start}
  .cardgrid.flat{grid-template-columns:repeat(3,1fr)}
  .cardpane{padding:0;overflow:hidden}
  /* Issuer visual language, not their artwork */
  .cardface{
    padding:15px 17px 13px;color:#fff;position:relative;min-height:112px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .cardface::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 42%);
  }
  .theme-platinum{background:linear-gradient(135deg,#8E969C 0%,#C6CDD2 42%,#6E777E 100%);color:#1B2226}
  .theme-platinum .cf-issuer,.theme-platinum .cf-foot{color:#2C363C}
  .theme-delta{background:linear-gradient(135deg,#0B1E3B 0%,#16305B 55%,#8A1327 100%)}
  .theme-csr{background:linear-gradient(118deg,#000006 0%,#071026 46%,#31405A 82%,#8E8B87 100%)}
  .theme-united{background:linear-gradient(118deg,#4B1D5B 0%,#451E54 52%,#2B1C37 100%)}

  @media (hover:none), (pointer:coarse){

    /* iOS Safari zooms the whole page in when a focused input's font is

    /* 16px keeps iOS from zooming on focus; the surrounding text scales up to
       match so the fields do not tower over their labels. */
    /* 16px stops iOS zooming on focus; tighter padding and slightly larger

    input.cell, select.cell{font-size:16px; padding:4px 8px; line-height:1.2}

       narrow screen. white-space:normal is restored on the annotation
       text underneath labels so it still wraps as intended. */
    table{display:block; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch}
    table thead, table tbody{display:table; width:max-content; min-width:100%}
    th, td{white-space:nowrap}

/* ============================================================
   CLOUD SYNC CONFIG
   Paste the two values from Supabase → Project Settings → API.
   Leave them blank and the app runs exactly as before, saving
   only to this browser.
   ============================================================ */
const SUPABASE_URL      = "";
const SUPABASE_ANON_KEY = "";

// Tolerate a pasted trailing slash, stray whitespace, or an accidental path
const cleanUrl = u => String(u||"").trim().replace(/\s+/g,"").replace(/\/+$/,"")
  .replace(/(\.supabase\.co).*$/i, "$1");
const cleanKey = k => String(k||"").trim().replace(/\s+/g,"");

const KEY = "finplan.demo";
let store = { ok:true, msg:"" };
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved.dataVersion !== DEFAULTS.dataVersion){
        // Keep the old plan retrievable instead of throwing it away
        localStorage.setItem(KEY + ".backup", raw);
        if(!cloudOn()){
          store = {ok:true, refreshed:true,
            msg:"Loaded updated figures. Your previous saved copy was set aside — press Restore previous if you want it back."};
        }
        return structuredClone(DEFAULTS);
      }
      return merge(structuredClone(DEFAULTS), saved);
    }
  }catch(e){ store = {ok:false, msg:"Browser storage is unavailable here, so edits last only for this session. Use Export JSON to keep a copy."}; }
  return structuredClone(DEFAULTS);
}
// Fill in anything the saved plan is missing, at any depth, without ever
// overwriting a value the user has set. This is what lets a new version add
// fields — a tax parameter, a per-person setting — and still load a plan
// saved before those fields existed. Arrays are kept whole: a saved list of
// spending lines or brackets is the user's, not ours to merge into.
function deepFill(saved, defs){
  if(saved === undefined || saved === null) return structuredClone(defs);
  if(Array.isArray(defs) || Array.isArray(saved)) return saved;
  if(typeof defs !== "object" || typeof saved !== "object") return saved;
  for(const k of Object.keys(defs)) saved[k] = deepFill(saved[k], defs[k]);
  return saved;
}

function merge(base, saved){
  const out = deepFill(structuredClone(saved || {}), DEFAULTS);
  // people is an array, so fill each entry against the matching default person
  if(Array.isArray(out.people)){
    out.people = out.people.map((p,i) => deepFill(p, DEFAULTS.people[i] || DEFAULTS.people[0]));
  }
  // older files stored caps as plain numbers rather than min/max objects
  for(const k of Object.keys(DEFAULTS.caps)){
    if(!out.caps || typeof out.caps[k] !== "object") out.caps = structuredClone(DEFAULTS.caps);
  }
  if(!out.cards || !out.cards.length) out.cards = structuredClone(DEFAULTS.cards);
  out.cardUse = out.cardUse || {};
  out.cardOffers = out.cardOffers || structuredClone(DEFAULTS.cardOffers);
  return out;
}
const today = () => new Date().toISOString().slice(0,10);
function touch(){ S.updated = today(); }
function saveLocal(){
  try{ S.dataVersion = DEFAULTS.dataVersion; localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ store = {ok:false, msg:"Browser storage is unavailable here, so edits last only for this session. Use Export JSON to keep a copy."}; }
}
function save(){ saveLocal(); cloudSave(); }

/* ============================================================
   SHARED PLAN — one household row, last write wins
   ============================================================ */
const CLOUD = { client:null, user:null, lastSync:null, dirty:false, timer:null, status:"local" };
const SB_URL = cleanUrl(SUPABASE_URL), SB_KEY = cleanKey(SUPABASE_ANON_KEY);
const cloudOn = () => !!(SB_URL && SB_KEY);

function setSync(status){
  CLOUD.status = status;
  const el = document.getElementById("syncBadge");
  if(!el) return;
  const label = {
    local:"Saved to this device", saving:"Saving…", saved:"Synced",
    error:"Sync failed — still saved locally", signedout:"Not signed in"
  }[status] || status;
  el.textContent = label;
  el.className = "syncbadge " + status;
}

async function cloudInit(){
  if(!cloudOn()){ setSync("local"); return; }
  try{
    const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
    CLOUD.client = createClient(SB_URL, SB_KEY, {
      auth:{ detectSessionInUrl:true, persistSession:true, autoRefreshToken:true, flowType:"pkce" }
    });

    // A failed sign-in comes back with the reason in the hash or query string.
    // Without this it silently looks like "the link just didn't work".
    const params = new URLSearchParams(
      (location.hash || "").replace(/^#/,"") || (location.search || "").replace(/^\?/,"")
    );
    const urlErr = params.get("error_description") || params.get("error");
    if(urlErr) CLOUD.urlError = decodeURIComponent(urlErr).replace(/\+/g," ");

    // PKCE links can arrive as ?code=... — exchange it for a session
    const code = new URLSearchParams(location.search).get("code");
    if(code){
      const { error: xErr } = await CLOUD.client.auth.exchangeCodeForSession(code);
      if(xErr) CLOUD.urlError = xErr.message;
      history.replaceState({}, "", location.pathname);
    }
    const { data } = await CLOUD.client.auth.getSession();
    CLOUD.user = data.session ? data.session.user : null;
    CLOUD.client.auth.onAuthStateChange((_evt, sess) => {
      CLOUD.user = sess ? sess.user : null;
      authUI();
      if(CLOUD.user) setTimeout(cloudLoad, 0);   // never call Supabase inside this callback
    });
    authUI();
    if(CLOUD.user) await cloudLoad(); else setSync("signedout");
    setInterval(pollRemote, 45000);
  }catch(e){
    console.error("Cloud sync unavailable:", e);
    setSync("error");
    CLOUD.urlError = "Couldn't reach the sync service. Check your connection, "
      + "or continue offline — changes will stay on this device only.";
    CLOUD.offlineOffer = true;
    authUI();
  }
}

async function cloudLoad(){
  if(!CLOUD.client || !CLOUD.user) return;
  const { data, error } = await CLOUD.client
    .from("plan").select("data,updated_at,updated_by").eq("id","household").maybeSingle();
  if(error){ setSync("error"); return; }
  if(data && data.data){
    S = merge(structuredClone(DEFAULTS), data.data);
    CLOUD.lastSync = data.updated_at;
    saveLocal(); render(); setSync("saved");
  } else {
    await cloudSave(true);        // first run: seed the shared row
  }
}

async function cloudSave(immediate){
  if(!CLOUD.client || !CLOUD.user) return;
  CLOUD.dirty = true; setSync("saving");
  clearTimeout(CLOUD.timer);
  const push = async () => {
    const { data, error } = await CLOUD.client.from("plan").upsert({
      id:"household", data:S,
      updated_at:new Date().toISOString(),
      updated_by:CLOUD.user.email
    }).select("updated_at").single();
    if(error){ console.error(error); setSync("error"); return; }
    CLOUD.lastSync = data.updated_at; CLOUD.dirty = false; setSync("saved");
  };
  if(immediate) return push();
  CLOUD.timer = setTimeout(push, 900);   // debounce so typing isn't a write per keystroke
}

// Pick up the other person's edits without a refresh
async function pollRemote(){
  if(!CLOUD.client || !CLOUD.user || CLOUD.dirty) return;
  const { data, error } = await CLOUD.client
    .from("plan").select("updated_at,updated_by").eq("id","household").maybeSingle();
  if(error || !data || data.updated_at === CLOUD.lastSync) return;
  if(document.activeElement && document.activeElement.matches && document.activeElement.matches(".cell")) return;
  await cloudLoad();
  flash("Updated by " + (data.updated_by || "someone else"));
}

function authUI(){
  const gate = document.getElementById("authGate");
  const out  = document.getElementById("signOutBtn");
  if(!gate) return;
  const needsAuth = cloudOn() && !CLOUD.user && !CLOUD.offlineOk;
  gate.hidden = !needsAuth;
  const off = document.getElementById("offlineBtn");
  if(off) off.hidden = !CLOUD.offlineOffer;
  if(needsAuth && CLOUD.urlError){
    const m = document.getElementById("authMsg");
    if(m){ m.textContent = "Sign-in link failed: " + CLOUD.urlError; m.className = "authmsg bad"; }
  }
  out.hidden = !(cloudOn() && CLOUD.user);
  if(CLOUD.user){
    const who = document.getElementById("whoami");
    if(who) who.textContent = CLOUD.user.email;
  }
}

async function signInPassword(){
  const email = (document.getElementById("authEmail").value || "").trim();
  const password = document.getElementById("authPass").value || "";
  const msg = document.getElementById("authMsg");
  if(!email || !password){ msg.textContent = "Enter your email and password."; msg.className="authmsg bad"; return; }
  msg.textContent = "Signing in…"; msg.className = "authmsg"; CLOUD.urlError = null;
  const { error } = await CLOUD.client.auth.signInWithPassword({ email, password });
  if(error){
    msg.textContent = /invalid login/i.test(error.message)
      ? "That email and password don't match an account."
      : "Couldn't sign in: " + error.message;
    msg.className = "authmsg bad";
  } else {
    msg.textContent = "Signed in."; msg.className = "authmsg";
    document.getElementById("authGate").hidden = true;
  }
}

async function verifyCode(){
  const email = (document.getElementById("authEmail").value || "").trim();
  const token = (document.getElementById("authCode").value || "").trim();
  const msg = document.getElementById("authMsg");
  if(!email || !token){ msg.textContent = "Enter your email and the 6-digit code."; return; }
  msg.textContent = "Checking…";
  const { error } = await CLOUD.client.auth.verifyOtp({ email, token, type:"email" });
  if(error){ msg.textContent = "That code didn't work: " + error.message; msg.className = "authmsg bad"; }
  else { CLOUD.urlError = null; msg.textContent = "Signed in."; msg.className = "authmsg"; }
}

async function sendMagicLink(){
  const email = (document.getElementById("authEmail").value || "").trim();
  const msg = document.getElementById("authMsg");
  if(!email){ msg.textContent = "Enter your email address."; return; }
  msg.textContent = "Sending…"; msg.className = "authmsg"; CLOUD.urlError = null;
  const { error } = await CLOUD.client.auth.signInWithOtp({
    email, options:{ emailRedirectTo: location.href.split("#")[0] }
  });
  if(error){
    const hint = /invalid path|not found/i.test(error.message)
      ? " — check that SUPABASE_URL ends at .supabase.co with no trailing slash or path."
      : /redirect|not allowed/i.test(error.message)
      ? " — add this site's address under Authentication → URL Configuration in Supabase."
      : "";
    msg.textContent = "Couldn't send the link: " + error.message + hint;
    console.error("Auth error:", error, "| using URL:", SB_URL);
  } else {
    msg.textContent = "Check " + email + " for a sign-in link. It opens straight back here.";
  }
}

/* ============================================================
   MODEL — same arithmetic as the workbook
   ============================================================ */
const mo = it => it.c === "y" ? it.a/12 : it.a;
const sum = (arr,f) => arr.reduce((t,x)=>t+f(x),0);

// One paycheck at a given annual rate, run through the same deduction chain.
function checkAt(p, annual){
  const gross   = p.paychecks ? annual/p.paychecks : 0;
  const preAmt  = gross * p.pre401k;
  const taxable = gross - preAmt - p.otherPre;
  const tax     = taxable * p.taxRate;
  const postAmt = (taxable - tax) * p.post401k;
  const net     = taxable - tax - postAmt - p.otherPost;
  return { gross, preAmt, taxable, tax, postAmt, net };
}

function person(p){
  // A mid-year raise splits the year into two rates. raiseChecks is how many
  // of this year's paychecks land at the new salary; the rest are at the old.
  const hasRaise   = (p.newSalary || 0) > 0 && (p.raiseChecks || 0) > 0;
  // A new salary with no paychecks assigned changes nothing — easy to enter
  // one and miss the other, so it gets surfaced rather than silently ignored.
  const raisePending = (p.newSalary || 0) > 0 && !(p.raiseChecks || 0);
  const rateB      = hasRaise ? p.newSalary : p.salary;        // rate going forward
  const checksB    = hasRaise ? Math.min(p.raiseChecks, p.paychecks) : p.paychecks;
  const checksA    = p.paychecks - checksB;
  const A          = checkAt(p, p.salary);                     // before the raise
  const B          = checkAt(p, rateB);                        // after the raise

  // The visible per-paycheck chain reflects the rate now in effect
  const gross      = B.gross;
  const preAmt     = B.preAmt;
  const taxable    = B.taxable;
  const tax        = B.tax;
  const postAmt    = B.postAmt;
  const net        = B.net;
  // The projection and the recommender must share one basis, or they contradict
  // each other. Both work forward from what's already been contributed:
  //   projected = YTD  +  rate x (gross x paychecks left)  +  rate x bonus still to come
  const grossLeft     = B.gross * p.checksLeft;
  const fromRemaining = grossLeft * p.pre401k;
  const fromBonus     = p.bonusLeft * p.pre401k;
  const total401k     = p.ytd401k + fromRemaining + fromBonus;
  const room          = S.irsLimit - total401k;
  const denom         = grossLeft + p.bonusLeft;
  // True when YTD is blank but the year is already part-spent — the inputs
  // can't both be right, and every 401k figure below depends on it.
  const dataGap       = p.ytd401k === 0 && p.checksLeft < p.paychecks;
  return {
    ...p, gross, preAmt, taxable, tax, postAmt, net,   // p.pre401k / p.post401k stay as rates
    hasRaise, raisePending, rateB, checksA, checksB, netA: A.net, netB: B.net,
    grossA: A.gross, grossB: B.gross,
    raiseDelta: B.net - A.net,
    takeHomePct: gross ? net/gross : 0,
    // Monthly is what the current salary pays, since that is what lands in
    // checking from here on. Annual figures below blend both salaries.
    monthly: B.net * p.paychecks / 12,
    monthlyIfWholeYear: A.net * p.paychecks / 12,
    annualGross: A.gross*checksA + B.gross*checksB + p.bonus,
    annualNet: A.net*checksA + B.net*checksB,
    annualTax: A.tax*checksA + B.tax*checksB,
    grossLeft, fromRemaining, fromBonus, total401k, room, dataGap,
    // The plan hard-stops at the IRS limit, so landing slightly over is safe —
    // the contributions simply cease. Under the limit is the outcome to avoid.
    //   room > 0        -> projected below the limit      -> Under target (amber)
    //   -500 <= room <=0 -> at the limit, up to $500 past -> On target (green)
    //   room < -500      -> more than $500 past           -> Over limit (red)
    status: dataGap ? "warn" : room > 0 ? "warn" : room >= -500 ? "ok" : "bad",
    statusText: dataGap ? "Needs YTD" : room > 0 ? "Under target" : room >= -500 ? "On target" : "Over limit",
    recPct: denom > 0 ? (S.irsLimit - p.ytd401k)/denom : 0,
    recPerCheck: denom > 0 ? B.gross * (S.irsLimit - p.ytd401k)/denom : 0,
  };
}

function model(){
  const P = S.people.map(person);
  const netTotal   = sum(P, p=>p.monthly);
  const fixedBase  = sum(S.fixed, mo);
  const misc       = fixedBase * S.miscPct;
  const fixedTotal = fixedBase + misc;
  const investTotal= sum(S.invest, mo);
  const savingsTotal = sum(S.savings, mo);
  const free       = netTotal - fixedTotal - investTotal - savingsTotal;
  const pre401kYr  = sum(P, p=>p.total401k);
  const post401kYr = sum(P, p=>p.postAmt * p.paychecks);
  const brokerageYr= investTotal * 12;
  const savedYr    = pre401kYr + post401kYr + S.iraTotal + brokerageYr;
  const netYr      = sum(P, p=>p.annualNet);
  return {
    P, netTotal, fixedBase, misc, fixedTotal, investTotal, savingsTotal, free,
    pct:{
      fixed: netTotal ? fixedTotal/netTotal : 0,
      invest: netTotal ? investTotal/netTotal : 0,
      savings: netTotal ? savingsTotal/netTotal : 0,
      free: netTotal ? free/netTotal : 0
    },
    pre401kYr, post401kYr, brokerageYr, savedYr, netYr,
    savingsRate: netYr ? savedYr/netYr : 0,
    afterFixed: netTotal - fixedTotal
  };
}

/* ---------- formatting ---------- */
const usd  = n => (n<0?"−":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});
const usd2 = n => (n<0?"−":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = (n,d=1) => (n*100).toFixed(d) + "%";
const esc  = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dash(){
  const m = model();
  const nw = nwModel();
  const cardSoon = expiringSoon();
  const cap = S.caps.fixed.max;

  const alerts = [];
  m.P.forEach(p=>{
    if(p.dataGap) alerts.push(["warn", `${p.name}: 401k year-to-date is $0 with ${p.checksLeft} of ${p.paychecks} paychecks left. Enter the paystub figure.`]);
    else if(p.room > 0) alerts.push(["warn", `${p.name}: 401k projects ${usd(p.total401k)} at ${pct(p.pre401k,1)} — ${usd(p.room)} short of the ${usd(S.irsLimit)} max. Recommender: ${pct(p.recPct,2)}.`]);
    else if(p.room >= -500) alerts.push(["ok", `${p.name}: 401k reaches the ${usd(S.irsLimit)} max at ${pct(p.pre401k,1)}.`]);
    else alerts.push(["bad", `${p.name}: 401k projects ${usd(p.total401k)} at ${pct(p.pre401k,1)} — ${usd(-p.room)} past the max. Recommender: ${pct(p.recPct,2)}.`]);
  });
  if(m.pct.fixed > cap) alerts.push(["bad", `Fixed costs are ${pct(m.pct.fixed)} of take-home, ${usd(m.fixedTotal - m.netTotal*cap)}/mo above the ${pct(cap,0)} ceiling.`]);
  else alerts.push(["ok", `Fixed costs are ${pct(m.pct.fixed)} of take-home, ${usd(m.netTotal*cap - m.fixedTotal)}/mo under the ${pct(cap,0)} ceiling.`]);
  if(m.free < 0) alerts.push(["bad", `Allocations exceed net income by ${usd(-m.free)}/mo.`]);

  m.P.filter(p=>p.raisePending).forEach(p=>alerts.push(["warn",
    `${p.name} has a new salary of ${usd(p.newSalary)} entered but no paychecks assigned to it, so every figure still uses ${usd(p.salary)}.`]));

  // ---- tax ----
  const tx = taxModel();
  if(S.tax.priorFed === 0 || S.tax.priorCA === 0){
    alerts.push(["warn", `Prior-year tax is $0 on the tax tab, so the safe harbor target computes as $0. Enter last year's federal and California totals.`]);
  } else if(tx.fedShort > 0 || tx.caShort > 0){
    if(tx.fedShort > 0) alerts.push(["bad", `Federal safe harbor is ${usd(tx.fedShort)} short — ${usd(tx.fedPerQuarter)} per remaining quarter.`]);
    if(tx.caShort > 0)  alerts.push(["bad", `California safe harbor is ${usd(tx.caShort)} short.`]);
  } else {
    alerts.push(["ok", `Safe harbor met on both federal and California. Further estimates are optional.`]);
  }

  alerts.push(tx.combinedBal >= 0
    ? ["ok",   `Tax projects a ${usd(tx.combinedBal)} refund at current withholding and payments.`]
    : ["warn", `Tax projects ${usd(-tx.combinedBal)} still owed at current withholding and payments.`]);

  const inPhaseout = tx.agi > TPF().saltThresh && tx.agi < saltFloorAt();
  if(inPhaseout) alerts.push(["warn", `AGI of ${usd(tx.agi)} sits inside the SALT phase-out, putting the marginal rate at ${pct(tx.marginal)}.`]);
  else if(tx.headroom > 0) alerts.push(["ok", `${usd(tx.headroom)} of income before the SALT phase-out begins at ${usd(TPF().saltThresh)}.`]);

  if(tx.netCap > 0) alerts.push(["warn", `${usd(tx.netCap)} of net realized gains so far, carrying about ${usd(tx.netCap * tx.marginal)} of tax at the current marginal rate.`]);
  else if(tx.carryforward < 0) alerts.push(["ok", `${usd(-tx.carryforward)} of capital losses carrying forward to next year.`]);
  const topFixed = [...S.fixed].sort((a,b)=>mo(b)-mo(a)).slice(0,6);

  const seg = (cls,label,val,p) => `<div class="seg ${cls}" style="flex:0 0 ${Math.max(0,p*100).toFixed(2)}%" title="${label}: ${usd(val)}">${p>0.07?`<span class="pct num">${pct(p,0)}</span>`:""}</div>`;

  return `

/* ============================================================
   TAX — mirrors the 2026 Tax Model workbook
   Federal brackets: IRS Rev. Proc. 2025-32. SALT: OBBBA / IRC 164(b).
   California: FTB MFJ 2026 estimated schedule.
   ============================================================ */
// Seed values only — the live figures are in S.tax.params and are editable.
const FED = {
  std: 32200,
  ord: [[0,.10],[24800,.12],[100800,.22],[211400,.24],[403550,.32],[512450,.35],[768700,.37]],
  // Long-term gains / qualified dividends stack on top of ordinary income
  ltcg: [[0,98900,0],[98900,613700,.15],[613700,Infinity,.20]],
  saltCap:40400, saltThresh:505000, saltRate:.30, saltFloor:10000, saltFloorAt:606333,
  niitRate:.038, niitThresh:250000,
  addMedRate:.009, addMedThresh:250000,
  charFloor:.005            // OBBBA: itemized charity only above 0.5% of AGI
};
const CA = {
  std: 11412,
  ord: [[0,.01],[22160,.02],[52530,.04],[82905,.06],[115085,.08],
        [145450,.093],[742960,.103],[891540,.113],[1485910,.123]],
  mhstRate:.01, mhstThresh:1000000
};

const TP  = () => S.tax.params;
const TPF = () => S.tax.params.fed;
const TPC = () => S.tax.params.ca;
const cap0 = v => (v === null || v === undefined) ? Infinity : v;

function progTax(income, table){
  let t = 0;
  for(let i=0;i<table.length;i++){
    const lo = table[i][0], rate = table[i][1];
    const hi = i+1 < table.length ? table[i+1][0] : Infinity;
    if(income > lo) t += (Math.min(income,hi) - lo) * rate;
  }
  return t;
}
// Preferential income is taxed by where it lands ON TOP of ordinary income,
// so it can span the 0% / 15% / 20% bands.
function prefTaxTiered(ordTaxable, prefTaxable){
  let t = 0;
  for(const [lo,hi,rate] of TPF().ltcg.map(b=>[b[0],cap0(b[1]),b[2]])){
    const top = Math.min(ordTaxable + prefTaxable, hi), bot = Math.max(ordTaxable, lo);
    if(top > bot) t += (top - bot) * rate;
  }
  return t;
}
const saltCapAt = magi => { const F = TPF(); return Math.max(F.saltFloor,
  Math.min(F.saltCap, F.saltCap - F.saltRate * Math.max(0, magi - F.saltThresh))); };
// income at which the phase-out bottoms out
const saltFloorAt = () => { const F = TPF();
  return F.saltThresh + (F.saltCap - F.saltFloor) / F.saltRate; };

// One full return. `delta` realizes an extra gain/loss so the harvesting
// modeller can re-run the whole thing rather than approximating a rate.
function taxRun(delta, term){
  const T = S.tax, F = TPF(), C = TPC();
  delta = delta || 0;
  // Gross earnings come from the income plan, blended across both salaries
  // when there has been a mid-year raise, plus bonus. Entered once, not twice.
  const inc = model();
  const grossK = inc.P[1].annualGross, grossS = inc.P[0].annualGross;
  const boxK = grossK - T.k401kK - T.preTaxK;      // W-2 Box 1
  const boxS = grossS - T.k401kS - T.preTaxS;
  const wages = boxK + boxS;
  const medicareWages = grossK + grossS;           // 401k does not reduce these
  const realized = sum(T.accounts, a => a.a);
  const stRaw = realized - T.ltPortion + (term === "ST" ? delta : 0);
  const ltRaw = T.ltPortion + (term === "LT" ? delta : 0);
  const netCap = stRaw + ltRaw;
  const carryforward = netCap < -3000 ? netCap + 3000 : 0;
  const ltComp = Math.max(0, Math.min(ltRaw, netCap));
  const stComp = netCap < 0 ? Math.max(netCap, -3000) : netCap - ltComp;

  const agi = wages + T.interest + T.ordDiv + stComp + ltComp;
  const ordinaryIncome = wages + T.interest + (T.ordDiv - T.qualDiv) + stComp;
  const preferential = T.qualDiv + ltComp;

  // California first — its tax feeds the SALT subtotal
  const caItemRaw   = T.mortInterest + T.propTax + T.vlf + T.charitable;
  const caPhaseout  = agi > C.itemThresh
    ? Math.min(C.itemRate * (agi - C.itemThresh), C.itemCapPct * caItemRaw)
    : 0;
  const caItemized  = caItemRaw - caPhaseout;
  const caDeduction = Math.max(caItemized, C.std);
  const caTaxable   = Math.max(0, agi - caDeduction - T.usGovDiv);
  const caTax = progTax(caTaxable, C.ord) + C.mhstRate * Math.max(0, caTaxable - C.mhstThresh);

  const saltSubtotal = caTax + T.propTax + T.vlf;
  const saltCap = saltCapAt(agi);
  const saltAllowed = Math.min(saltSubtotal, saltCap);
  const charDeductible = Math.max(0, T.charitable - F.charFloor * agi);
  const nonSalt = T.mortInterest + charDeductible;
  const itemRaw = saltAllowed + nonSalt;
  const itemized = itemRaw;
  const fedDeduction = Math.max(itemized, F.std);
  const useItemized = itemized > F.std;

  const ordTaxable  = Math.max(0, ordinaryIncome - fedDeduction);
  const prefTaxable = Math.max(0, (agi - fedDeduction) - ordTaxable);
  const fedOrd  = progTax(ordTaxable, F.ord);
  const fedPref = prefTaxTiered(ordTaxable, prefTaxable);
  const prefRateUsed = prefTaxable > 0 ? fedPref / prefTaxable : 0;
  const prefTopRate = F.ltcg.reduce((r,[lo,hi,rate]) =>
    (ordTaxable + prefTaxable) > lo ? rate : r, 0);
  const nii  = T.interest + T.ordDiv + Math.max(0, netCap);
  const niit = F.niitRate * Math.min(nii, Math.max(0, agi - F.niitThresh));
  const k401kTotal = T.k401kK + T.k401kS;
  const addMedBase = Math.max(0, medicareWages - F.addMedThresh);
  const addMed = F.addMedRate * addMedBase;
  const niitBase = Math.min(nii, Math.max(0, agi - F.niitThresh));
  const fedTax = fedOrd + fedPref + niit + addMed;

  return {
    grossK, grossS, boxK, boxS, wages, medicareWages, k401kTotal, addMedBase, niitBase,
    realized, stRaw, ltRaw, netCap, carryforward, stComp, ltComp,
    agi, ordinaryIncome, preferential,
    caItemized, caDeduction, caTaxable, caTax, caPhaseout,
    saltSubtotal, saltCap, saltAllowed, charDeductible, nonSalt, itemized,
    itemRaw, caItemRaw, caPhaseout,
    fedDeduction, useItemized, ordTaxable, prefTaxable,
    fedOrd, fedPref, prefRateUsed, prefTopRate, nii, niit, addMed, fedTax,
    totalTax: fedTax + caTax,
    effRate: agi > 0 ? (fedTax + caTax) / agi : 0
  };
}

// Which bracket a given taxable income lands in
const topBracket = (income, table) => {
  let rate = table[0][1];
  for(const [lo,r] of table) if(income > lo) rate = r;
  return rate;
};
const bracketFloor = (income, table) => {
  let lo = 0;
  for(const [f] of table) if(income > f) lo = f;
  return lo;
};

function taxModel(){
  const T = S.tax;
  const base = taxRun(0, T.scenTerm);
  const scen = taxRun(T.scenAmount, T.scenTerm);
  // True marginal: re-run the whole return with $1,000 more of a realized gain.
  // Captures federal brackets, NIIT, California, and the SALT feedback loop.
  const plusST = taxRun(1000, "ST"), plusLT = taxRun(1000, "LT");
  const marginal   = (plusST.totalTax - base.totalTax) / 1000;
  // The rate stack below is only valid until ordinary income reaches the next
  // bracket, so surface that distance rather than leaving it implied.
  const fo = TPF().ord;
  const nextIdx = fo.findIndex(b => b[0] > base.ordTaxable);
  const nextBracketAt   = nextIdx > -1 ? fo[nextIdx][0] : null;
  const nextBracketRate = nextIdx > -1 ? fo[nextIdx][1] : null;
  const bracketHeadroom = nextBracketAt !== null ? nextBracketAt - base.ordTaxable : Infinity;
  const marginalLT = (plusLT.totalTax - base.totalTax) / 1000;
  const d = (a,k) => (a[k] - base[k]) / 1000;
  const fedBracketRate = topBracket(base.ordTaxable, TPF().ord);
  const marginalParts = {
    fedBracket: fedBracketRate,
    saltFeedback: d(plusST,"fedOrd") - fedBracketRate,   // extra CA tax enlarges the SALT deduction
    niit: d(plusST,"niit"),
    addMed: d(plusST,"addMed"),
    ca: d(plusST,"caTax")
  };
  const ltParts = {
    pref: d(plusLT,"fedPref"),
    saltFeedback: d(plusLT,"fedOrd"),
    niit: d(plusLT,"niit"),
    ca: d(plusLT,"caTax")
  };

  const wh = p => {
    const paid = Math.max(0, p.perYear - p.left);
    return {
      paid,
      fedYtd: p.fedPer * paid, caYtd: p.caPer * paid,
      fedRem: p.fedPer * p.left, caRem: p.caPer * p.left,
      fed: p.fedPer * p.perYear, ca: p.caPer * p.perYear
    };
  };
  const k = wh(T.whK), sb = wh(T.whS);
  const fedWH = k.fed + sb.fed, caWH = k.ca + sb.ca;
  const fedEst = sum(T.fedPmts, x => x), caEst = sum(T.caPmts, x => x);
  const fedPaid = fedWH + fedEst, caPaid = caWH + caEst;

  const fedRequired = Math.min(0.9 * base.fedTax, 1.10 * T.priorFed);
  const caRequired  = Math.min(0.9 * base.caTax,  1.10 * T.priorCA);
  // Estimates already sent count toward the required annual payment
  const fedShort = Math.max(0, fedRequired - fedWH - fedEst);
  const caShort  = Math.max(0, caRequired - caWH - caEst);

  return {
    ...base, scen, marginal, marginalLT, marginalParts, ltParts,
    nextBracketAt, nextBracketRate, bracketHeadroom,
    fedTopRate:  topBracket(base.ordTaxable, TPF().ord),
    fedTopFloor: bracketFloor(base.ordTaxable, TPF().ord),
    fedBlended:  base.ordTaxable > 0 ? base.fedOrd / base.ordTaxable : 0,
    caTopRate:   topBracket(base.caTaxable, TPC().ord),
    caTopFloor:  bracketFloor(base.caTaxable, TPC().ord),
    caBlended:   base.caTaxable > 0 ? base.caTax / base.caTaxable : 0,
    scenChange: scen.totalTax - base.totalTax,
    scenBenefit: base.totalTax - scen.totalTax,
    scenRate: T.scenAmount !== 0 ? (base.totalTax - scen.totalTax) / Math.abs(T.scenAmount) : 0,
    k, sb, fedWH, caWH, fedEst, caEst, fedPaid, caPaid,
    fedBal: fedPaid - base.fedTax,
    caBal:  caPaid - base.caTax,
    combinedBal: (fedPaid - base.fedTax) + (caPaid - base.caTax),
    fedRequired, caRequired, fedShort, caShort,
    fedPerQuarter: fedShort / 4,
    caQ1: caShort * 0.30, caQ2: caShort * 0.40, caQ4: caShort * 0.30,
    headroom: TPF().saltThresh - base.agi,
    saltStatus: base.agi > saltFloorAt() ? "Capped at $10,000"
              : base.agi > TPF().saltThresh  ? "Partially phased out" : "Full $40,400"
  };
}

/* ============================================================
   CREDIT CARD BENEFITS
   ============================================================ */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Card artwork supplied by the cardholder, inlined so the file stays self-contained
const CARD_IMG = {};

// Which slots a credit has, and what each is worth
function periodsOf(c){
  if(c.period === "monthly")   return MONTHS.map((m,i)=>({key:m, label:m, amt: (i===11 && c.dec) ? c.dec : c.amt}));
  if(c.period === "quarterly") return [0,1,2,3].map(i=>({key:"Q"+(i+1), label:"Q"+(i+1), amt:c.amt}));
  if(c.period === "semi")      return [0,1].map(i=>({key:"H"+(i+1), label:"H"+(i+1), amt:c.amt}));
  return [{key:"Y", label:"Full year", amt:c.amt}];
}
// Index of the slot the calendar is in right now
function currentSlot(c, d){
  const m = d.getMonth();
  if(c.period === "monthly")   return m;
  if(c.period === "quarterly") return Math.floor(m/3);
  if(c.period === "semi")      return m < 6 ? 0 : 1;
  return 0;
}
const useKey = (cardId, ci, pk) => `${cardId}:${ci}:${pk}`;
// Stored value is either `true` (marked used in full) or a dollar amount,
// so annual credits can record partial use — $146 of a $200 airline credit.
const useRaw = (cardId, ci, pk) => S.cardUse[useKey(cardId, ci, pk)];
const isUsed = (cardId, ci, pk) => !!useRaw(cardId, ci, pk);
const usedAmt = (cardId, ci, pk, full) => {
  const v = useRaw(cardId, ci, pk);
  if(v === true) return full;
  if(typeof v === "number") return Math.max(0, Math.min(v, full));
  return 0;
};

function cardModel(){
  const now = new Date();
  const cards = S.cards.map(card => {
    const credits = card.credits.map((c,ci) => {
      const slots = periodsOf(c);
      const cur = currentSlot(c, now);
      const total = sum(slots, p => p.amt);
      const used  = sum(slots, p => usedAmt(card.id, ci, p.key, p.amt));
      // Slots that have closed with anything left on the table
      const missed = sum(slots.filter((p,i) => i < cur),
                         p => p.amt - usedAmt(card.id, ci, p.key, p.amt));
      const openNow = slots[cur].amt - usedAmt(card.id, ci, slots[cur].key, slots[cur].amt);
      return {...c, ci, slots, cur, total, used, missed, openNow,
              pctUsed: total > 0 ? used/total : 0};
    });
    const total  = sum(credits, c => c.total);
    const used   = sum(credits, c => c.used);
    const missed = sum(credits, c => c.missed);
    const openNow = sum(credits, c => c.openNow);
    const totalFee = card.fee + (card.auFee || 0);
    const offers = (S.cardOffers && S.cardOffers[card.id]) || [];
    const offersTotal = sum(offers, o => o.a || 0);
    return {...card, credits, total, used, missed, openNow, totalFee,
            offers, offersTotal,
            captured: used + offersTotal,
            net: used + offersTotal - totalFee,
            pctUsed: total > 0 ? used/total : 0};
  });
  const withCredits = cards.filter(c => c.credits.length);
  return {
    cards, withCredits,
    totalFees: sum(cards, c => c.totalFee),
    totalAvailable: sum(cards, c => c.total),
    totalUsed: sum(cards, c => c.used),
    totalOffers: sum(cards, c => c.offersTotal),
    totalCaptured: sum(cards, c => c.captured),
    totalMissed: sum(cards, c => c.missed),
    totalOpen: sum(cards, c => c.openNow),
    net: sum(cards, c => c.captured) - sum(cards, c => c.totalFee)
  };
}

// Credits whose current window closes soonest, for the dashboard
function expiringSoon(){
  const now = new Date();
  const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const daysLeftInMonth = Math.ceil((endOfMonth - now)/864e5);
  const out = [];
  S.cards.forEach(card => card.credits.forEach((c,ci) => {
    const slots = periodsOf(c), cur = currentSlot(c, now);
    const left = slots[cur].amt - usedAmt(card.id, ci, slots[cur].key, slots[cur].amt);
    if(left <= 0) return;
    let days;
    if(c.period === "monthly") days = daysLeftInMonth;
    else if(c.period === "quarterly") days = Math.ceil((new Date(now.getFullYear(), (Math.floor(now.getMonth()/3)+1)*3, 0) - now)/864e5);
    else if(c.period === "semi") days = Math.ceil((new Date(now.getFullYear(), now.getMonth()<6?6:12, 0) - now)/864e5);
    else days = Math.ceil((new Date(now.getFullYear(), 12, 0) - now)/864e5);
    out.push({card:card.name, credit:c.n, amt:left, slot:slots[cur].label, days, period:c.period});
  }));
  return out.sort((a,b) => a.days - b.days || b.amt - a.amt);
}

/* ============================================================
   NET WORTH
   ============================================================ */
let nwRange = "all";

function nwModel(){
  const assets = sum(S.nw.assets, x=>x.a);
  const cash   = sum(S.nw.cash,   x=>x.a);
  const debt   = sum(S.nw.debt,   x=>x.a);
  const total  = assets + cash - debt;
  const hist   = [...S.nw.history].sort((a,b)=> a[0] < b[0] ? -1 : 1);
  const last   = hist.length ? hist[hist.length-1] : null;
  const prev   = hist.length > 1 ? hist[hist.length-2] : null;
  const yStart = new Date().getFullYear() + "-01-01";
  const firstThisYear = hist.find(h=>h[0] >= yStart);
  const yearAgo = new Date(Date.now() - 365*864e5).toISOString().slice(0,10);
  const firstYearAgo = hist.find(h=>h[0] >= yearAgo);
  return {
    assets, cash, debt, total, hist, last, prev,
    sinceLast: last && prev ? last[1]-prev[1] : 0,
    ytd: last && firstThisYear ? last[1]-firstThisYear[1] : 0,
    yoy: last && firstYearAgo ? last[1]-firstYearAgo[1] : 0,
    // peak of what has actually been logged, so today's balance can beat it
    peak: hist.length ? Math.max(...hist.map(h=>h[1])) : 0,
    priorPeak: hist.length > 1 ? Math.max(...hist.slice(0,-1).map(h=>h[1])) : 0,
    liquid: cash - S.nw.debt.filter(d=>/credit|tax/i.test(d.n)).reduce((t,d)=>t+d.a,0)
  };
}

function chart(hist, w, h, opts={}){
  if(hist.length < 2) return `<div style="color:var(--muted);font-size:12px;padding:20px 0">Log at least two entries to see the trend.</div>`;
  const pad = opts.bare ? {t:4,r:4,b:4,l:4} : {t:12,r:14,b:22,l:56};
  const xs = hist.map(p=>new Date(p[0]).getTime());
  const ys = hist.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const padY=(y1-y0)*0.12 || 1000; y0-=padY; y1+=padY;
  const px = t => pad.l + (x1===x0?0:(t-x0)/(x1-x0))*(w-pad.l-pad.r);
  const py = v => pad.t + (1-(v-y0)/(y1-y0))*(h-pad.t-pad.b);
  const pts = hist.map((p,i)=>[px(xs[i]), py(p[1])]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${h-pad.b} L${pts[0][0].toFixed(1)} ${h-pad.b} Z`;
  const gridVals = opts.bare ? [] : [y0+(y1-y0)*0.15, (y0+y1)/2, y1-(y1-y0)*0.15];
  const yr = t => new Date(t).getFullYear();
  const ticks = opts.bare ? [] : [...new Set(xs.map(yr))].map(y=>({y, t:new Date(y+"-01-01").getTime()})).filter(d=>d.t>=x0);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Net worth over time">
    <defs><linearGradient id="nwg${opts.bare?"s":""}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F6B4F" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#2F6B4F" stop-opacity="0"/></linearGradient></defs>
    ${gridVals.map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}" stroke="#E7EAE6"/>
      <text x="${pad.l-8}" y="${(py(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#8A948E" font-family="ui-monospace,Menlo,monospace">${"$"+(v/1e6).toFixed(2)}M</text>`).join("")}
    ${ticks.map(d=>`<text x="${px(d.t).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10" fill="#8A948E">${d.y}</text>`).join("")}
    <path d="${area}" fill="url(#nwg${opts.bare?"s":""})"/>
    <path d="${line}" fill="none" stroke="#2F6B4F" stroke-width="${opts.bare?1.5:1.8}" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="#2F6B4F"/>
    ${opts.bare?"":hist.map((p,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="6" fill="transparent"><title>${p[0]} — ${usd(p[1])}</title></circle>`).join("")}
  </svg>`;
}

// Compact sparkline for the masthead — light stroke for the dark background
function headSpark(hist, w=120, h=26){
  if(hist.length < 2) return "";
  const ys = hist.map(p=>p[1]);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(hi===lo){ hi+=1; lo-=1; }
  const px = i => (i/(hist.length-1))*(w-4)+2;
  const py = v => h-3 - ((v-lo)/(hi-lo))*(h-8);
  const pts = hist.map((p,i)=>[px(i), py(p[1])]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = line + ` L${(w-2).toFixed(1)} ${h} L2 ${h} Z`;
  const end = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <defs><linearGradient id="hsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FC3A0" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#7FC3A0" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#hsg)"/>
    <path d="${line}" fill="none" stroke="#7FC3A0" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="2.4" fill="#EAF3ED"/>
  </svg>`;
}
