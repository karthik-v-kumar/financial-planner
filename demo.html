  const n = (f,v,w) => `<input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(v)}" data-tax="${f}"${w?` style="width:${w}"`:""}>`;
  const inRow = (label, f, note="") =>
    `<tr><td class="lab">${label}${note?`<span class="note">${note}</span>`:""}</td><td style="text-align:right">${n(f,T[f])}</td></tr>`;
  const row = (label, cells, cls="", note="") =>
    `<tr class="${cls}"><td class="lab">${label}${note?`<span class="note">${note}</span>`:""}</td>${cells.map(c=>`<td class="calc">${c}</td>`).join("")}</tr>`;
  // parameter inputs: np = scalar, nb = bracket cell, nl = ltcg band cell
  const np = (path,v,kind) => kind==="plain"
    ? `<input class="cell" type="text" inputmode="numeric" data-num="1" data-raw="1" value="${v}" data-param="${path}">`
    : kind==="pct"
    ? `<span class="pctwrap"><input class="cell pct" type="text" inputmode="decimal" data-num="1" data-pct="1" value="${+(v*100).toFixed(4)}" data-param="${path}"><span class="suffix">%</span></span>`
    : `<input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(v)}" data-param="${path}">`;
  const nb = (which,i,col,v,isPct) => isPct
    ? `<span class="pctwrap"><input class="cell pct" type="text" inputmode="decimal" data-num="1" data-pct="1" value="${+(v*100).toFixed(3)}" data-brk="${which}" data-i="${i}" data-col="${col}"><span class="suffix">%</span></span>`
    : `<input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(v)}" data-brk="${which}" data-i="${i}" data-col="${col}">`;
  const nl = (i,col,v,isPct) => isPct
    ? `<span class="pctwrap"><input class="cell pct" type="text" inputmode="decimal" data-num="1" data-pct="1" value="${+(v*100).toFixed(3)}" data-ltcg="${i}" data-col="${col}"><span class="suffix">%</span></span>`
    : `<input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(v)}" data-ltcg="${i}" data-col="${col}">`;
  const whIn = (who,f) => `<input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(T[who][f])}" data-wh="${who}" data-f="${f}">`;
  const whBlock = (who, name) => { const k = t[who==="whK"?"k":"sb"]; return `
    <div class="calcband">${esc(name)}</div>
    <table class="calctbl">
      <colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup>
      <thead><tr><th></th><th>Federal</th><th>California</th></tr></thead>
      <tbody>
        <tr><td class="lab">Paychecks per year</td><td colspan="2" style="text-align:right">${whIn(who,"perYear")}</td></tr>
        <tr><td class="lab">Paychecks remaining</td><td colspan="2" style="text-align:right">${whIn(who,"left")}</td></tr>
        <tr class="sub"><td>Already paid</td><td class="calc" colspan="2">${k.paid} paychecks</td></tr>
        <tr><td class="lab">Withheld per check<span class="note">Federal Withholding and State Tax lines only — not Social Security, Medicare or CA SDI</span></td>
          <td style="text-align:right">${whIn(who,"fedPer")}</td>
          <td style="text-align:right">${whIn(who,"caPer")}</td></tr>
        ${row("Withheld so far",[usd(k.fedYtd), usd(k.caYtd)])}
        ${row("Still to be withheld",[usd(k.fedRem), usd(k.caRem)])}
        ${row("Projected year-end withholding",[usd(k.fed), usd(k.ca)],"total")}
      </tbody>
    </table>`; };
  const qLabels = ["Q1 — Apr 15","Q2 — Jun 15","Q3 — Sep 15","Q4 — Jan 15"];

  return `
  <h2 class="section">Tax planning</h2>
  <p class="section-note">Wages come from the income plan. Update the investment figures and withholding here; everything else recalculates. A plain-language walkthrough sits at the bottom of this tab.</p>
  <p class="plainline">On <strong>${usd(t.agi)}</strong> of total income, tax comes to <strong>${usd(t.totalTax)}</strong> — about <strong>${pct(t.effRate)}</strong> overall, with the next dollar taxed at <strong>${pct(t.marginal)}</strong>. Withholding and payments so far cover <strong>${usd(t.fedPaid + t.caPaid)}</strong>, leaving a projected ${t.combinedBal>=0?"refund":"balance due"} of <strong>${usd(Math.abs(t.combinedBal))}</strong>.</p>

  <div class="kpis six sticky">
    <div class="kpi accent">
      <div class="eyebrow">Total tax</div>
      <div class="v">${usd(t.totalTax)}</div>
      <div class="sub">Federal ${usd(t.fedTax)} · California ${usd(t.caTax)}</div>
    </div>
    <div class="kpi">
      <div class="eyebrow">${t.combinedBal >= 0 ? "Projected refund" : "Projected owed"}</div>
      <div class="v">${usd(Math.abs(t.combinedBal))}</div>
      <div class="sub">Fed ${t.fedBal>=0?"+":"−"}${usd(Math.abs(t.fedBal))} · CA ${t.caBal>=0?"+":"−"}${usd(Math.abs(t.caBal))}</div>
    </div>
    <div class="kpi">
      <div class="eyebrow">Effective tax rate</div>
      <div class="v">${pct(t.effRate)}</div>
      <div class="sub">of ${usd(t.agi)} AGI</div>
    </div>
    <div class="kpi">
      <div class="eyebrow">Marginal tax rate</div>
      <div class="v">${pct(t.marginal)}</div>
      <div class="sub">next $1,000 of short-term gain · long-term ${pct(t.marginalLT)}</div>
    </div>
    <div class="kpi">
      <div class="eyebrow">Total deductions</div>
      <div class="v">${usd(t.fedDeduction)}</div>
      <div class="sub">${t.useItemized
        ? `Itemized, ${usd(t.itemized - TPF().std)} above the ${usd(TPF().std)} standard`
        : `Standard — itemized only reaches ${usd(t.itemized)}`}</div>
    </div>
    <div class="kpi">
      <div class="eyebrow">MAGI headroom to $505k</div>
      <div class="v">${usd(t.headroom)}</div>
      <div class="sub">SALT: ${t.saltStatus}</div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h3>Inputs <span class="caprule">Everything the calculation below is built from</span></h3>
    <div class="inputwrap">

      <section class="ig">
        <div class="calcband tight">Wages</div>
        <div class="ig-head">
          <span class="eyebrow"></span>
          <span class="eyebrow">${esc(S.people[1].name)}</span>
          <span class="eyebrow">${esc(S.people[0].name)}</span>
        </div>
        <div class="ig-row">
          <span class="ig-lab">Gross earnings<em>From the income plan — both salaries plus bonus</em></span>
          <span class="val">${usd(t.grossK)}</span><span class="val">${usd(t.grossS)}</span>
        </div>
        <div class="ig-row">
          <span class="ig-lab">less 401k</span>
          ${n("k401kK",T.k401kK)}${n("k401kS",T.k401kS)}
        </div>
        <div class="ig-row">
          <span class="ig-lab">less other pre-tax<em>FSA, HSA</em></span>
          ${n("preTaxK",T.preTaxK)}${n("preTaxS",T.preTaxS)}
        </div>
        <div class="ig-row sub">
          <span class="ig-lab">Taxable wages (W-2 Box 1)</span>
          <span class="val">${usd(t.boxK)}</span><span class="val">${usd(t.boxS)}</span>
        </div>
        <div class="ig-row grand">
          <span class="ig-lab">Combined taxable wages</span>
          <span class="val span2">${usd(t.wages)}</span>
        </div>
      </section>

      <section class="ig one">
        <div class="calcband tight">Deduction inputs</div>
        <div class="ig-head"><span class="eyebrow"></span><span class="eyebrow">Annual</span></div>
        <div class="ig-row"><span class="ig-lab">Mortgage interest</span>${n("mortInterest",T.mortInterest)}</div>
        <div class="ig-row"><span class="ig-lab">Property tax</span>${n("propTax",T.propTax)}</div>
        <div class="ig-row"><span class="ig-lab">Vehicle license fee<em>Deductible portion, both cars</em></span>${n("vlf",T.vlf)}</div>
        <div class="ig-row"><span class="ig-lab">Charitable</span>${n("charitable",T.charitable)}</div>
        <div class="ig-row sub"><span class="ig-lab">Itemized before SALT cap</span><span class="val">${usd(t.itemized)}</span></div>
      </section>

      <section class="ig one">
        <div class="calcband tight">Prior year</div>
        <div class="ig-head"><span class="eyebrow"></span><span class="eyebrow">${TP().year-1}</span></div>
        <div class="ig-row"><span class="ig-lab">Total federal tax<em>Form 1040, line 24</em></span>${n("priorFed",T.priorFed)}</div>
        <div class="ig-row"><span class="ig-lab">Total California tax</span>${n("priorCA",T.priorCA)}</div>
        <div class="ig-row sub"><span class="ig-lab">Safe harbor at 110%</span><span class="val">${usd(1.1*(T.priorFed+T.priorCA))}</span></div>
      </section>

    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Realized gains and losses <span class="tag ${t.netCap>=0?"warn":"ok"}">${t.netCap>=0?"Net gain":"Net loss"}</span></h3>

      <div class="calcband">Realized year to date, by account</div>
      <table class="calctbl">
        <colgroup><col><col style="width:130px"><col style="width:24px"></colgroup>
        <tbody>
          ${T.accounts.map((a,i)=>`<tr>
            <td class="lab"><input class="cell wide" value="${esc(a.n)}" data-acct="${i}" data-f="n"></td>
            <td style="text-align:right"><input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(a.a)}" data-acct="${i}" data-f="a"></td>
            <td><button class="rowdel" data-delacct="${i}" title="Remove">×</button></td></tr>`).join("")}
          ${row("Total realized",[usd(t.realized),""],"sub")}
          <tr><td class="lab">of which long-term<span class="note">Held more than a year</span></td>
            <td style="text-align:right">${n("ltPortion",T.ltPortion)}</td><td></td></tr>
        </tbody>
      </table>
      <button class="addrow tiny" data-addacct="1">+ Add account</button>

      <div class="calcband">How it is taxed</div>
      <div class="calcflow">
        <div class="cf-line"><span>Short-term<em>Taxed as ordinary income</em></span><b>${usd(t.stComp)}</b></div>
        <div class="cf-line"><span>Long-term<em>Taxed at the preferential rate</em></span><b>${usd(t.ltComp)}</b></div>
        <div class="cf-line grand"><span>Net capital gain / (loss)</span><b>${usd(t.netCap)}</b></div>
        ${t.carryforward < 0 ? `<div class="cf-line muted"><span>Carried forward to next year</span><b>${usd(t.carryforward)}</b></div>` : ""}
      </div>
    </div>

    <div class="card">
      <h3>Dividends and interest</h3>

      <div class="calcband">Received this year</div>
      <section class="ig one">
        <div class="ig-row"><span class="ig-lab">Interest income</span>${n("interest",T.interest)}</div>
        <div class="ig-row"><span class="ig-lab">Ordinary dividends<em>Total across all accounts</em></span>${n("ordDiv",T.ordDiv)}</div>
        <div class="ig-row"><span class="ig-lab">of which qualified<em>Taxed at the preferential rate</em></span>${n("qualDiv",T.qualDiv)}</div>
        <div class="ig-row"><span class="ig-lab">of which US govt obligations<em>SGOV and similar — exempt from California only</em></span>${n("usGovDiv",T.usGovDiv)}</div>
      </section>

      <div class="calcband">Where these amounts are used</div>
      <div class="calcflow">
        <div class="cf-line"><span>Non-qualified portion<em>Taxed as ordinary income</em></span><b>${usd(T.ordDiv - T.qualDiv)}</b></div>
        <div class="cf-line grand"><span>Net investment income<em>Base for the ${pct(TPF().niitRate,1)} NIIT</em></span><b>${usd(t.nii)}</b></div>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Tax calculation <span class="caprule">${TP().year} rates</span></h3>

      <div class="calcflow">
        <div class="cf-line"><span>Total income (AGI)</span><b>${usd(t.agi)}</b></div>
        <div class="cf-line"><span>less deduction<em>${t.useItemized?`Itemized, beating the ${usd(TPF().std)} standard`:"Standard deduction"}</em></span><b>−${usd(t.fedDeduction)}</b></div>
        <div class="cf-line result"><span>Federal taxable income</span><b>${usd(t.ordTaxable + t.prefTaxable)}</b></div>
      </div>

      <div class="calcband">Federal tax</div>
      <table class="calctbl">
        <colgroup><col style="width:42%"><col style="width:19%"><col style="width:19%"><col style="width:20%"></colgroup>
        <thead><tr><th>Component</th><th>Rate</th><th>Applies to</th><th>Tax</th></tr></thead>
        <tbody>
          <tr><td class="lab">Ordinary income<span class="note">Wages, interest, short-term gains</span></td>
            <td class="calc rate"><b>${pct(t.fedTopRate,0)}</b><em>top bracket</em></td>
            <td class="calc">${usd(t.ordTaxable)}</td><td class="calc">${usd(t.fedOrd)}</td></tr>
          <tr><td class="lab">Qualified dividends and long-term gains<span class="note">Stacked on top of ordinary income</span></td>
            <td class="calc rate"><b>${pct(t.prefRateUsed,0)}</b></td>
            <td class="calc">${usd(t.prefTaxable)}</td><td class="calc">${usd(t.fedPref)}</td></tr>
          <tr><td class="lab">Net investment income tax<span class="note">Investment income, or AGI over ${usd(TPF().niitThresh)} — whichever is less</span></td>
            <td class="calc rate"><b>${pct(TPF().niitRate,1)}</b></td>
            <td class="calc">${usd(t.niitBase)}</td><td class="calc">${usd(t.niit)}</td></tr>
          <tr><td class="lab">Additional Medicare<span class="note">Gross wages above ${usd(TPF().addMedThresh)}</span></td>
            <td class="calc rate"><b>${pct(TPF().addMedRate,1)}</b></td>
            <td class="calc">${usd(t.addMedBase)}</td><td class="calc">${usd(t.addMed)}</td></tr>
          <tr class="total"><td colspan="3">Total federal</td><td class="calc">${usd(t.fedTax)}</td></tr>
        </tbody>
      </table>

      <div class="calcband">California tax</div>
      <div class="calcflow">
        <div class="cf-line"><span>Total income (AGI)</span><b>${usd(t.agi)}</b></div>
        <div class="cf-line"><span>less US govt obligation dividends<em>SGOV and similar — taxed federally, exempt in California</em></span><b>−${usd(T.usGovDiv)}</b></div>
        <div class="cf-line"><span>less deduction<em>${t.caItemized > TPC().std
          ? `Itemized, beating the ${usd(TPC().std)} California standard`
          : "California standard deduction"}</em></span><b>−${usd(t.caDeduction)}</b></div>
        <div class="cf-line result"><span>California taxable income</span><b>${usd(t.caTaxable)}</b></div>
      </div>
      <table class="calctbl">
        <colgroup><col style="width:42%"><col style="width:19%"><col style="width:19%"><col style="width:20%"></colgroup>
        <tbody>
          <tr><td class="lab">Tax on that income<span class="note">Capital gains taxed as ordinary income</span></td>
            <td class="calc rate"><b>${pct(t.caTopRate,1)}</b><em>top bracket</em></td>
            <td class="calc">${usd(t.caTaxable)}</td><td class="calc">${usd(t.caTax)}</td></tr>
          <tr class="total"><td colspan="3">Total California</td><td class="calc">${usd(t.caTax)}</td></tr>
        </tbody>
      </table>

      <div class="calcflow bottom">
        <div class="cf-line grand"><span>Total tax, federal and California</span><b>${usd(t.totalTax)}</b></div>
        <div class="cf-line muted"><span>Blended rates applied</span>
          <b>${pct(t.fedBlended)} federal · ${pct(t.caBlended)} California</b></div>
      </div>
    </div>

    <div class="card">
      <h3>How the deduction was built</h3>

      <div class="calcband">State and local taxes</div>
      <div class="calcflow">
        <div class="cf-line"><span>California income tax<em>The tax computed above counts toward SALT</em></span><b>${usd(t.caTax)}</b></div>
        <div class="cf-line"><span>Property tax</span><b>${usd(T.propTax)}</b></div>
        <div class="cf-line"><span>Vehicle license fee</span><b>${usd(T.vlf)}</b></div>
        <div class="cf-line result"><span>SALT before the cap</span><b>${usd(t.saltSubtotal)}</b></div>
        <div class="cf-line"><span>Cap at this income<em>${t.saltStatus}</em></span><b>${usd(t.saltCap)}</b></div>
        <div class="cf-line result"><span>SALT allowed<em>Lesser of the two above</em></span><b>${usd(t.saltAllowed)}</b></div>
      </div>

      <div class="calcband">Other itemized deductions</div>
      <div class="calcflow">
        <div class="cf-line"><span>Mortgage interest</span><b>${usd(T.mortInterest)}</b></div>
        <div class="cf-line"><span>Charitable that counts<em>Only the part above ${pct(TPF().charFloor,1)} of AGI</em></span><b>${usd(t.charDeductible)}</b></div>
        <div class="cf-line result"><span>Total itemized</span><b>${usd(t.itemRaw)}</b></div>

        <div class="cf-line"><span>Standard deduction<em>Taken instead, if larger</em></span><b>${usd(TPF().std)}</b></div>
        <div class="cf-line grand"><span>Deduction used<em>${t.useItemized?"Itemizing wins":"Standard deduction wins"}</em></span><b>${usd(t.fedDeduction)}</b></div>
      </div>

      <div class="calcband">California, which follows different rules</div>
      <div class="calcflow">
        <div class="cf-line"><span>Mortgage interest</span><b>${usd(T.mortInterest)}</b></div>
        <div class="cf-line"><span>Property tax<em>No cap on the state return</em></span><b>${usd(T.propTax)}</b></div>
        <div class="cf-line"><span>Vehicle license fee</span><b>${usd(T.vlf)}</b></div>
        <div class="cf-line"><span>Charitable<em>Full amount — California has no 0.5% floor</em></span><b>${usd(T.charitable)}</b></div>
        <div class="cf-line"><span>California income tax<em>Not deductible on its own return</em></span><b>${usd(0)}</b></div>
        <div class="cf-line result"><span>California itemized</span><b>${usd(t.caItemRaw)}</b></div>
        ${t.caPhaseout > 0 ? `<div class="cf-line"><span>less high-income reduction<em>${pct(TPC().itemRate,0)} of AGI above ${usd(TPC().itemThresh)}, capped at ${pct(TPC().itemCapPct,0)} of itemized</em></span><b>−${usd(t.caPhaseout)}</b></div>
        <div class="cf-line result"><span>Itemized after reduction</span><b>${usd(t.caItemized)}</b></div>` : ""}
        <div class="cf-line"><span>California standard deduction<em>Taken instead, if larger</em></span><b>${usd(TPC().std)}</b></div>
        <div class="cf-line grand"><span>Deduction used<em>${t.caItemized > TPC().std ? "Itemizing wins" : "Standard deduction wins"}</em></span><b>${usd(t.caDeduction)}</b></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
      <h3>Withholding <span class="caprule">Tax already taken out of your paychecks</span></h3>
      <div class="grid2" style="margin-top:0">
        <div>${whBlock("whK", S.people[1].name)}</div>
        <div>${whBlock("whS", S.people[0].name)}</div>
      </div>
      <div class="calcflow bottom">
        <div class="cf-line grand"><span>Total withholding, both</span>
          <b>${usd(t.fedWH + t.caWH)}</b></div>
        <div class="cf-line muted"><span>Split</span>
          <b>${usd(t.fedWH)} federal · ${usd(t.caWH)} California</b></div>
      </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Estimated payments <span class="caprule">Quarterly payments you send directly</span></h3>

      <div class="calcband">Payments made this year</div>
      <table class="calctbl">
        <colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup>
        <thead><tr><th>Quarter</th><th>Federal</th><th>California</th></tr></thead>
        <tbody>
          ${qLabels.map((q,i)=>`<tr><td class="lab">${q}</td>
            <td style="text-align:right"><input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(T.fedPmts[i])}" data-pmt="fedPmts" data-i="${i}"></td>
            <td style="text-align:right"><input class="cell" type="text" inputmode="decimal" data-num="1" value="${nf(T.caPmts[i])}" data-pmt="caPmts" data-i="${i}"></td></tr>`).join("")}
          ${row("Total estimates",[usd(t.fedEst),usd(t.caEst)],"sub")}
        </tbody>
      </table>

      <div class="calcband">Applied against the tax owed</div>
      <table class="calctbl">
        <colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup>
        <tbody>
          ${row("Withholding",[usd(t.fedWH),usd(t.caWH)])}
          ${row("Estimates",[usd(t.fedEst),usd(t.caEst)])}
          ${row("Total paid",[usd(t.fedPaid),usd(t.caPaid)],"sub")}
          ${row("Total tax owed",[usd(t.fedTax),usd(t.caTax)])}
        </tbody>
      </table>
      <div class="calcflow bottom">
        <div class="cf-line grand"><span>${t.combinedBal>=0?"Projected refund":"Projected balance due"}</span>
          <b style="color:${t.combinedBal>=0?"var(--green)":"var(--red)"}">${usd(Math.abs(t.combinedBal))}</b></div>
        <div class="cf-line muted"><span>Split</span>
          <b>${t.fedBal>=0?"refund":"owed"} ${usd(Math.abs(t.fedBal))} federal · ${t.caBal>=0?"refund":"owed"} ${usd(Math.abs(t.caBal))} California</b></div>
      </div>
    </div>

    <div class="card">
      <h3>Safe harbor <span class="caprule">Pay at least this much to avoid a penalty</span></h3>

      <div class="calcband">The minimum required</div>
      <table class="calctbl">
        <colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup>
        <thead><tr><th></th><th>Federal</th><th>California</th></tr></thead>
        <tbody>
          ${row("90% of this year's tax",[usd(0.9*t.fedTax),usd(0.9*t.caTax)])}
          ${row("110% of last year's tax",[usd(1.1*T.priorFed),usd(1.1*T.priorCA)])}
          ${row("Required for the year",[usd(t.fedRequired),usd(t.caRequired)],"sub","Whichever is lower")}
        </tbody>
      </table>

      <div class="calcband">Already covered</div>
      <table class="calctbl">
        <colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup>
        <tbody>
          ${row("Withholding",[usd(t.fedWH),usd(t.caWH)])}
          ${row("Estimates already sent",[usd(t.fedEst),usd(t.caEst)])}
          ${row("Total covered",[usd(t.fedWH+t.fedEst),usd(t.caWH+t.caEst)],"sub")}
          <tr class="total"><td>Still to pay</td>

    <div class="inputwrap" style="margin-top:18px">

        <div class="ig-row"><span class="ig-lab">Phase-out rate</span>${np("fed.saltRate",TPF().saltRate,"pct")}</div>
        <div class="ig-row"><span class="ig-lab">SALT floor</span>${np("fed.saltFloor",TPF().saltFloor)}</div>
        <div class="ig-row"><span class="ig-lab">Charitable floor<em>share of AGI</em></span>${np("fed.charFloor",TPF().charFloor,"pct")}</div>
      </section>

      <section class="ig one">
        <div class="ig-head"><span class="eyebrow">Surtaxes</span><span class="eyebrow">Federal</span></div>
        <div class="ig-row"><span class="ig-lab">NIIT rate</span>${np("fed.niitRate",TPF().niitRate,"pct")}</div>
        <div class="ig-row"><span class="ig-lab">NIIT threshold<em>Not indexed — fixed by statute</em></span>${np("fed.niitThresh",TPF().niitThresh)}</div>
        <div class="ig-row"><span class="ig-lab">Additional Medicare rate</span>${np("fed.addMedRate",TPF().addMedRate,"pct")}</div>
        <div class="ig-row"><span class="ig-lab">Additional Medicare threshold<em>Not indexed — fixed by statute</em></span>${np("fed.addMedThresh",TPF().addMedThresh)}</div>
      </section>

      <section class="ig one">
        <div class="ig-head"><span class="eyebrow">California</span><span class="eyebrow">State</span></div>
        <div class="ig-row"><span class="ig-lab">Standard deduction <span class="yearly">yearly</span></span>${np("ca.std",TPC().std)}</div>
        <div class="ig-row"><span class="ig-lab">Mental health surtax rate</span>${np("ca.mhstRate",TPC().mhstRate,"pct")}</div>
        <div class="ig-row"><span class="ig-lab">Surtax threshold</span>${np("ca.mhstThresh",TPC().mhstThresh)}</div>
        <div class="ig-row"><span class="ig-lab">Itemized phase-out starts <span class="yearly">yearly</span><em>FTB publishes this late in the year</em></span>${np("ca.itemThresh",TPC().itemThresh)}</div>
        <div class="ig-row"><span class="ig-lab">Phase-out rate</span>${np("ca.itemRate",TPC().itemRate,"pct")}</div>
        <div class="ig-row"><span class="ig-lab">Reduction capped at<em>Share of itemized deductions</em></span>${np("ca.itemCapPct",TPC().itemCapPct,"pct")}</div>
      </section>
    </div>

    <div class="calcband" style="margin-top:16px">Long-term gains bands</div>
    <p class="caprule" style="margin:0 0 8px">Measured against total taxable income, with long-term gains stacked on top of ordinary income.</p>
    <table class="calctbl" style="max-width:560px">
      <thead><tr><th>Taxable income from</th><th>up to</th><th>Rate</th></tr></thead>
      <tbody>
        ${TPF().ltcg.map((b,i)=>`<tr>
          <td>${nl(i,0,b[0])}</td>
          <td>${b[1]===null?`<span class="calc" style="color:var(--muted)">no limit</span>`:nl(i,1,b[1])}</td>
          <td>${nl(i,2,b[2],true)}</td></tr>`).join("")}
      </tbody>
    </table>
  </div>

  <div class="card guide" style="margin-top:14px">
    <h3>How this tab works</h3>
    <p>Tax is worked out in four stages, and the cards above follow that order.</p>

    <div class="guide-grid">
    <p><strong>1 — Add up the income.</strong> Wages come from the income plan automatically. Everything earned from investments is entered here: gains from selling, dividends, and interest. Added together these give <strong>adjusted gross income</strong>, or AGI, the figure most thresholds are measured against.</p>

    <p><strong>2 — Subtract the deductions.</strong> Everyone may subtract a fixed <strong>standard deduction</strong>. Alternatively you may add up specific costs — mortgage interest, property tax, charitable giving, state taxes paid — and subtract those instead. That is <strong>itemizing</strong>, and it is worth doing only when the total is larger. What remains is <strong>taxable income</strong>.</p>

    <p><strong>3 — Apply the rates.</strong> Income is taxed in bands: the first slice at the lowest rate, each later slice higher. So a "24% bracket" means only the portion above that bracket's floor is taxed at 24%, not the whole amount. Investments held longer than a year are taxed at lower rates than everything else, which is why the calculation separates them. Two surtaxes may also apply at higher incomes.</p>

    <p><strong>4 — Compare against what has been paid.</strong> Tax is paid through the year, through payroll withholding and any quarterly payments sent directly. If those add up to more than the tax owed, the difference comes back as a refund; less, and the balance is due at filing. <strong>Safe harbor</strong> is the minimum that must be paid during the year to avoid a late-payment penalty, even if the rest is settled later.</p>
    </div>

    <p class="guide-note">Two terms worth knowing. The <strong>marginal rate</strong> is what the next dollar earned would be taxed at, which is always higher than the <strong>effective rate</strong> — the average across all income. And California computes its own tax separately, with different deductions and no lower rate for long-term investments, which is why it appears as its own section throughout.</p>

    <p class="guide-note">This is a planning model built from published rates, not a tax return. It does not handle alternative minimum tax, and a preparer has the final word.</p>
  </div>
`;

  const creditBlock = (card, c) => `

  const cardBlock = card => `

      </tbody>
    </table>
  </div>

  <div class="cardgrid">
    ${m.withCredits.map(cardBlock).join("")}

  <h3 class="subsection">Flat rewards cards</h3>

const views = { dash, income, spend, tax: taxview, cards: cardsview, networth };
let current = "dash";

function render(){
  // With sync configured, nothing is drawn until we know who is signed in.
  // Previously the cached plan painted first and the gate arrived a moment
  // later, leaving real figures on screen in the gap.
  if(cloudOn() && !CLOUD.user && !CLOUD.offlineOk){
    document.querySelectorAll(".view").forEach(v => v.innerHTML = "");
    const tk = document.getElementById("ticker"); if(tk) tk.innerHTML = "";
    const stmp = document.getElementById("stamp"); if(stmp) stmp.textContent = "";
    authUI();
    return;
  }
  document.getElementById("view-"+current).innerHTML = views[current]();
  const d = new Date(S.updated+"T00:00:00");
  document.getElementById("stamp").textContent =
    "Last edited " + (S.updated === today() ? "today" : d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}));
  document.getElementById("brandYear").textContent = new Date().getFullYear();

  const n = nwModel();
  document.getElementById("ticker").innerHTML = n.last ? `
    <span class="tk-lab">Net worth</span>
    <span class="tk-val">${usd(n.total)}</span>
    <span class="tk-chg ${n.sinceLast>=0?"up":"down"}">${n.sinceLast>=0?"+":"−"}${usd(Math.abs(n.sinceLast))}</span>
    ${headSpark(n.hist.slice(-30))}` : "";
  const note = document.getElementById("storeNote");
  note.textContent = store.msg || "";
  note.className = store.refreshed ? "note refreshed" : "note";
  const rb = document.getElementById("restoreBtn");
  let hasBackup = false;
  try{ hasBackup = !!localStorage.getItem(KEY + ".backup"); }catch(_){}
  rb.hidden = !hasBackup || cloudOn();
  authUI();
}

document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.onclick = () => {
    current = b.dataset.view;
    document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", String(x===b)));
    document.querySelectorAll(".view").forEach(v=>v.hidden = v.id !== "view-"+current);
    render();
    window.scrollTo({top:0});
  };
});

// Thousands separators inside the blue input cells
const nf = v => (typeof v === "number" && isFinite(v))
  ? v.toLocaleString("en-US",{maximumFractionDigits:2}) : v;

const parseNum = s => {
  const n = parseFloat(String(s).replace(/[$,\s]/g,""));
  return isNaN(n) ? 0 : n;
};

document.addEventListener("input", e=>{
  const el = e.target;
  if(!el.matches(".cell")) return;
  const num  = el.dataset.num === "1";
  const isPct = el.dataset.pct === "1";
  const val  = num ? (isPct ? parseNum(el.value)/100 : parseNum(el.value)) : el.value;

  if(el.dataset.g){ S[el.dataset.g] = val; }
  else if(el.dataset.note){ S.notes[el.dataset.note] = val; }
  else if(el.dataset.p !== undefined){ S.people[+el.dataset.p][el.dataset.f] = val; }
  else if(el.dataset.nw){ S.nw[el.dataset.nw][+el.dataset.i][el.dataset.f] = val; }
  else if(el.dataset.gain !== undefined){ S.nw.gains.rows[+el.dataset.gain].v[+el.dataset.col] = val; }
  else if(el.dataset.tax){ S.tax[el.dataset.tax] = val; }
  else if(el.dataset.acct){ S.tax.accounts[+el.dataset.acct][el.dataset.f] = val; }
  else if(el.dataset.wh){ S.tax[el.dataset.wh][el.dataset.f] = val; }
  else if(el.dataset.pmt){ S.tax[el.dataset.pmt][+el.dataset.i] = val; }
  else if(el.dataset.param){
    const p = el.dataset.param.split(".");
    if(p.length === 1) S.tax.params[p[0]] = val;
    else S.tax.params[p[0]][p[1]] = val;
  }
  else if(el.dataset.brk){
    S.tax.params[el.dataset.brk].ord[+el.dataset.i][+el.dataset.col] = val;
    // brackets must stay in ascending order or progTax misreads them
    S.tax.params[el.dataset.brk].ord.sort((a,b)=>a[0]-b[0]);
  }
  else if(el.dataset.ltcg){ S.tax.params.fed.ltcg[+el.dataset.ltcg][+el.dataset.col] = val; }
  else if(el.dataset.offer){
    const list = S.cardOffers[el.dataset.offer] || (S.cardOffers[el.dataset.offer] = []);
    list[+el.dataset.i][el.dataset.f] = val;
  }
  else if(el.dataset.useamt){
    if(val > 0) S.cardUse[el.dataset.useamt] = val;
    else delete S.cardUse[el.dataset.useamt];
  }
  else if(el.dataset.list){ S[el.dataset.list][+el.dataset.i][el.dataset.f] = val; }
  else return;

  touch(); save();

  // Re-render, then put the caret back exactly where it was. Every editable
  // cell is a text input, so selectionStart is reliable here.
  const sel = el.dataset.g ? `[data-g="${el.dataset.g}"]`
            : el.dataset.note ? `[data-note="${el.dataset.note}"]`
            : el.dataset.p !== undefined ? `[data-p="${el.dataset.p}"][data-f="${el.dataset.f}"]`
            : el.dataset.nw ? `[data-nw="${el.dataset.nw}"][data-i="${el.dataset.i}"][data-f="${el.dataset.f}"]`
            : el.dataset.gain !== undefined ? `[data-gain="${el.dataset.gain}"][data-col="${el.dataset.col}"]`
            : el.dataset.tax ? `[data-tax="${el.dataset.tax}"]`
            : el.dataset.acct ? `[data-acct="${el.dataset.acct}"][data-f="${el.dataset.f}"]`
            : el.dataset.wh ? `[data-wh="${el.dataset.wh}"][data-f="${el.dataset.f}"]`
            : el.dataset.pmt ? `[data-pmt="${el.dataset.pmt}"][data-i="${el.dataset.i}"]`
            : el.dataset.param ? `[data-param="${el.dataset.param}"]`
            : el.dataset.brk ? `[data-brk="${el.dataset.brk}"][data-i="${el.dataset.i}"][data-col="${el.dataset.col}"]`
            : el.dataset.ltcg ? `[data-ltcg="${el.dataset.ltcg}"][data-col="${el.dataset.col}"]`
            : el.dataset.useamt ? `[data-useamt="${el.dataset.useamt}"]`
            : el.dataset.offer ? `[data-offer="${el.dataset.offer}"][data-i="${el.dataset.i}"][data-f="${el.dataset.f}"]`
            : `[data-list="${el.dataset.list}"][data-i="${el.dataset.i}"][data-f="${el.dataset.f}"]`;
  const typed = el.value;
  const pos = el.selectionStart;
  render();
  const next = document.querySelector(sel);
  if(next){
    next.value = typed;              // keeps "", "1." and "0.0" exactly as typed
    next.focus();
    if(pos !== null) try{ next.setSelectionRange(pos,pos); }catch(_){}
  }
});

// Re-apply comma formatting when a cell loses focus
document.addEventListener("blur", e=>{
  const el = e.target;
  if(el && el.matches && el.matches('.cell[data-num="1"]') && el.dataset.pct !== "1" && el.dataset.raw !== "1"){
    el.value = nf(parseNum(el.value));
  }
}, true);

document.addEventListener("change", e=>{
  if(e.target.matches("select.cell") && e.target.dataset.basis){
    S.incomeBasis = e.target.value; touch(); save(); render(); return;
  }
  if(e.target.matches("select.cell") && e.target.dataset.scenterm){
    S.tax.scenTerm = e.target.value; touch(); save(); render(); return;
  }
  if(e.target.matches("select.cell")){
    S[e.target.dataset.list][+e.target.dataset.i].c = e.target.value;
    touch(); save(); render();
  }
});

document.addEventListener("click", e=>{
  const addbrk = e.target.closest("[data-addbrk]");
  if(addbrk){
    const list = S.tax.params[addbrk.dataset.addbrk].ord;
    const last = list[list.length-1];
    list.push([last[0] + 50000, last[1]]);
    touch(); save(); render(); return;
  }
  const delbrk = e.target.closest("[data-delbrk]");
  if(delbrk){
    S.tax.params[delbrk.dataset.delbrk].ord.splice(+delbrk.dataset.i, 1);
    touch(); save(); render(); return;
  }

  const addfix = e.target.closest("[data-addfixed]");
  if(addfix){
    S.fixed.push({g:addfix.dataset.addfixed, n:"New line item", a:0, c:"m"});
    touch(); save(); render(); return;
  }

  const add = e.target.closest("[data-add]");
  if(add){
    const l = add.dataset.add;
    if(l==="fixed") S.fixed.push({g:"Other", n:"New line item", a:0, c:"m"});
    else S[l].push({n:"New line item", a:0, c:"m"});
    touch(); save(); render();
    return;
  }
  const del = e.target.closest("[data-del]");
  if(del){ S[del.dataset.del].splice(+del.dataset.i,1); touch(); save(); render(); return; }

  const addoffer = e.target.closest("[data-addoffer]");
  if(addoffer){
    const id = addoffer.dataset.addoffer;
    (S.cardOffers[id] || (S.cardOffers[id] = [])).push({n:"", a:0});
    touch(); save(); render(); return;
  }
  const deloffer = e.target.closest("[data-deloffer]");
  if(deloffer){
    S.cardOffers[deloffer.dataset.deloffer].splice(+deloffer.dataset.i, 1);
    touch(); save(); render(); return;
  }

  const usefull = e.target.closest("[data-usefull]");
  if(usefull){
    const k = usefull.dataset.usefull;
    if(S.cardUse[k] === true) delete S.cardUse[k]; else S.cardUse[k] = true;
    touch(); save(); render(); return;
  }

  const use = e.target.closest("[data-use]");
  if(use){
    const k = use.dataset.use;
    if(S.cardUse[k]) delete S.cardUse[k]; else S.cardUse[k] = true;
    touch(); save(); render(); return;
  }

  const range = e.target.closest("[data-range]");
  if(range){ nwRange = range.dataset.range; render(); return; }

  const addnw = e.target.closest("[data-addnw]");
  if(addnw){
    const l = addnw.dataset.addnw;
    if(l === "history"){
      const d = document.getElementById("nwDate").value || today();
      const v = parseNum(document.getElementById("nwVal").value);
      if(!v){ flash("Enter an amount to log."); return; }
      const at = S.nw.history.findIndex(h=>h[0]===d);
      if(at >= 0) S.nw.history[at][1] = v; else S.nw.history.push([d, v]);
      S.nw.history.sort((x,y)=> x[0] < y[0] ? -1 : 1);
      flash(at >= 0 ? "Updated " + d : "Logged " + usd(v));
    } else {
      S.nw[l].push({n:"New line", note:"", a:0});
    }
    touch(); save(); render(); return;
  }

  if(e.target.closest("[data-addacct]")){ S.tax.accounts.push({n:"New account", a:0}); touch(); save(); render(); return; }

  const delacct = e.target.closest("[data-delacct]");
  if(delacct){ S.tax.accounts.splice(+delacct.dataset.delacct,1); touch(); save(); render(); return; }

  const delnw = e.target.closest("[data-delnw]");
  if(delnw){ S.nw[delnw.dataset.delnw].splice(+delnw.dataset.i,1); touch(); save(); render(); }
});

function flash(msg){
  const f = document.getElementById("flash");
  f.textContent = msg; f.classList.add("show");
  setTimeout(()=>f.classList.remove("show"), 2200);
}

document.getElementById("restoreBtn").onclick = ()=>{
  try{
    const raw = localStorage.getItem(KEY + ".backup");
    if(!raw){ flash("No previous copy saved."); return; }
    if(confirm("Bring back your previous saved plan? The current figures will be replaced.")){
      S = merge(structuredClone(DEFAULTS), JSON.parse(raw));
      localStorage.removeItem(KEY + ".backup");
      store = {ok:true, msg:""};
      save(); render(); flash("Previous plan restored");
    }
  }catch(e){ flash("Couldn't restore that copy."); }
};

function startFresh(){
  const P = S.people.map((p,i) => ({...p, name: i===0 ? "Person 1" : "Person 2",
    salary:0, bonus:0, pre401k:0, post401k:0, otherPre:0, otherPost:0,
    ytd401k:0, bonusLeft:0 }));
  S.people = P;
  S.fixed   = S.fixed.map(i => ({...i, a:0}));      // keep the line items as a scaffold
  S.invest  = S.invest.map(i => ({...i, a:0}));
  S.savings = S.savings.map(i => ({...i, a:0}));
  S.tax = {...S.tax,
    grossK:0, k401kK:0, preTaxK:0, grossS:0, k401kS:0, preTaxS:0,
    interest:0, ordDiv:0, qualDiv:0, usGovDiv:0, ltPortion:0,
    mortInterest:0, propTax:0, vlf:0, charitable:0, priorFed:0, priorCA:0,
    accounts:[{n:"Account 1", a:0}],
    fedPmts:[0,0,0,0], caPmts:[0,0,0,0],
    whK:{...S.tax.whK, fedPer:0, caPer:0}, whS:{...S.tax.whS, fedPer:0, caPer:0},
    scenAmount:0 };
  S.nw = {...S.nw,
    assets:  S.nw.assets.map(i => ({...i, a:0})),
    cash:    S.nw.cash.map(i => ({...i, a:0})),
    debt:    S.nw.debt.map(i => ({...i, a:0})),
    history: [],
    gains:{...S.nw.gains, rows:S.nw.gains.rows.map(r => ({...r, v:r.v.map(()=>0)}))} };
  S.cardUse = {};
  touch(); save(); render();
}

document.getElementById("freshBtn").onclick = ()=>{
  if(confirm("Clear every figure so you can enter your own? Line items and cards stay, all amounts go to zero. Export first if you want a copy.")){
    startFresh(); flash("Cleared — enter your own numbers");
  }
};

document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("Replace everything with the original spreadsheet values? Your current edits will be lost.")){
    S = structuredClone(DEFAULTS); save(); render(); flash("Reset to defaults");
  }
};

document.getElementById("authSend").onclick = signInPassword;
document.getElementById("offlineBtn").onclick = ()=>{
  CLOUD.offlineOk = true; authUI(); setSync("local");
  flash("Working offline — changes stay on this device.");
};
document.getElementById("authEmail").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("authPass").focus(); });
document.getElementById("authPass").addEventListener("keydown", e=>{ if(e.key==="Enter") signInPassword(); });
document.getElementById("signOutBtn").onclick = async ()=>{
  if(CLOUD.client){ await CLOUD.client.auth.signOut(); flash("Signed out"); }
};

// Synchronous, so the gate is up on the very first frame — cloudInit's
// network round trip happens behind it rather than in front of it.
if(cloudOn()) document.getElementById("authGate").hidden = false;

render();
cloudInit();
</script>
